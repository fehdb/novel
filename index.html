const storyData=[{"type":"chapter","value":"[파장(破章)]"},{"type":"section","value":"제1절: 우리는 그대를 소환한다 (上)"},{"type":"narrative","value":"지독한 현기증이 전신을 덮쳤다."},{"type":"narrative","value":"마치 시공간의 틈새에 몸이 내던져진 것처럼 의식이 아득하게 흩어졌다 끌어모아지기를 반복했다. 눈을 뜰 수조차 없는 강렬한 빛—태고의 마력이 뿜어내는 붉고 둔탁한 마력광이 시야를 온통 가리고 있었다."},{"type":"narrative","value":"얼마나 시간이 지났을까. 가슴을 옥죄던 중력이 서서히 사라지고, 코끝을 스치는 공기의 촉감이 완전히 달라졌다. 차갑고 묵직한, 오래된 석조 건물 특유의 습한 냄새."},{"type":"narrative","value":"천천히 눈을 뜨자 흩어지는 빛의 잔영 너머로 낯선 고대 석조 회랑의 풍경이 모습을 드러냈다. 그리고 그 공간의 중앙, 나직하게 헐떡이는 숨소리와 함께 한 소녀가 서 있었다."},{"type":"narrative","value":"어깨너머로 흩날리는 강렬한 붉은 머리칼. 견고하게 제련된 쇠갑옷 위에 붉은 망토를 두른 소녀였다. 그녀의 손에는 제 몸집만 한 무거운 전투 도끼가 쥐어져 있었다. 소녀는 하얗게 질린 얼굴로 떨리는 두 손을 그러모으며, 눈동자에 경외와 안도가 뒤섞인 채 나를 바라보았다."},{"type":"dialogue","who":"","value":"\"아앗! 다행이야... 정말로, 정말로 이 세계에 와 주었구나!\""},{"type":"narrative","value":"소녀는 오랫동안 간절히 바란 신을 맞이하듯, 벅차오르는 뜨거운 탄성을 내뱉었다."},{"type":"dialogue","who":"","value":"\"이계의 대영웅님! 오래된 전승의 말대로... 당장이라도 멸망할 듯 흔들리는 이 조국을 구할 구세주로서...!\""},{"type":"narrative","value":"소녀는 눈물마저 글썽이며 나를 향해 한 걸음 다가왔다. 하지만 그 순간, 나를 위아래로 천천히 훑어보는 그녀의 붉은 눈동자가 미세하게 흔들리기 시작했다."},{"type":"narrative","value":"전승 속에서 시대를 호령하던 전설적인 영웅이라 보기엔, 내 차림새가 전장의 웅장함이나 기백과는 너무나 거리가 멀었기 때문이었다. 전신을 감싼 튼튼한 갑옷도, 핏빛 세월을 견뎌낸 무기도 없이, 그저 평범하기 그지없는 옷차림을 한 나를 보며 소녀는 눈을 몇 번이고 비볐다."},{"type":"dialogue","who":"","value":"\"엣, 어라...? 잠깐, 너... 정말 전승에 나오던 그 영웅 맞아? 어쩐지 위엄이라곤 조금도 느껴지지 않는데...\""},{"type":"narrative","value":"갑작스러운 소환도 모자라 황당함이 밀려든 나는 대체 이곳이 어디냐고, 당신은 누구냐고 되물었다. 소녀는 당황한 기색을 숨기지 못한 채 헛숨을 내쉬었다."},{"type":"dialogue","who":"","value":"\"엑? 여기가 어디냐니...? 너, 대체 어느 차원의 이계에서 날아온 거야? 이곳은...\""},{"type":"narrative","value":"그녀의 설명이 채 이어지기도 전이었다."},{"type":"narrative","value":"쿵! 쿵! 쿵!"},{"type":"narrative","value":"석조 회랑의 짙은 그림자 너머로 육중한 철갑 장화 소리가 묵직하게 울려 퍼졌다. 정적을 찢는 살기 어린 고함이 돌벽을 타고 기분 나쁘게 울렸다."},{"type":"dialogue","who":"","value":"\"찾았다, 침입자들이다! 모두 죽여라!\""},{"type":"narrative","value":"그림자 속에서 엠블라 제국의 문양이 꺾여 새겨진 갑옷을 입은 거구의 도끼병, '액스 파이터'가 혈기를 뿜어내며 돌진해 왔다. 붉은 눈을 번뜩이며 들고 있는 거대한 도끼는 당장이라도 우리의 목을 쳐낼 기세였다."},{"type":"dialogue","who":"","value":"\"큭... 엠블라 제국의 침략병들이 벌써 여기까지 들어오다니!\""},{"type":"narrative","value":"소녀는 지체 없이 허리춤의 전투 도끼를 고쳐 쥐었다. 조금 전까지의 당황한 기색은 온데간데없이, 칠흑 같은 날카로운 기세로 내 앞을 막아섰다."},{"type":"dialogue","who":"","value":"\"넌 뒤로 물러나 있어! 저 자식들은 내가 어떻게든 모조리 베어버릴 테니까!\""},{"type":"narrative","value":"순식간에 싸늘한 전장으로 변해버린 회랑 속에서, 소녀는 한 치의 망설임도 없이 바닥을 차며 적을 향해 뛰쳐나갔다."},{"type":"dialogue","who":"","value":"\"가자! 기선제압이다. 거리를 좁혀서 단숨에 친다!\""},{"type":"narrative","value":"쇠와 쇠가 부딪히는 굉음이 정적을 깨뜨렸다. 적병이 휘두른 중전사 도끼가 석벽을 긁어내며 불꽃을 튀겼고, 소녀는 날렵한 몸짓으로 그 공격을 쳐내며 틈새를 파고들었다. 묵직한 타격음과 차가운 마찰열이 회랑 안을 핏빛으로 물들였다. 치열한 합을 주고받은 끝에, 엠블라의 도끼병은 가슴 팍을 꿰뚫린 채 비명을 지르며 바닥 위로 쓰러졌다."},{"type":"dialogue","who":"","value":"\"후우... 어찌저찌 목숨은 건졌네.\""},{"type":"narrative","value":"안나는 거칠어진 숨을 내쉬며 이마에 맺힌 땀방울을 장갑 낀 손등으로 문질러 닦았다. 그제야 그녀는 서서히 무기의 검기를 거두고, 경계를 한풀 푼 채 나를 향해 늠름한 자세로 정식 인사를 건븸었다."},{"type":"dialogue","who":"","value":"\"나는 안나. 아스크 왕국을 수호하는 특무기관의 대장을 맡고 있어. 우리 특무기관은 칠흑 같은 침략의 손길로부터 여러 세계와 영웅들을 구원하는 임무를 띠고 있지.\""},{"type":"narrative","value":"그녀는 내가 온 세계에는 '영웅'이나 '마법'이라는 개념조차 아득할지 모른다며 씁쓸한 미소를 지었다."},{"type":"dialogue","who":"","value":"\"이 세계의 중심에는 무수한 차원과 통하는 영원의 문이 존재하고, 그 문 너머에는 수많은 세계의 전설적인 '영웅'들이 살아가. 방금 널 습격한 자들은 이웃 나라 엠블라 제국의 흉악한 정예병들이야.\""},{"type":"narrative","value":"이야기가 깊어질수록 안나의 붉은 눈동자에는 짙은 절박함과 사명감이 피어올랐다."},{"type":"dialogue","who":"","value":"\"놈들이 노리는 건 이계의 문을 짓밟고 모든 차원을 수하에 두는 것... 지금 이 순간에도 우리 아스크 왕국은 엠블라의 참혹한 군화 밑에 짓밟힐 위기에 처해 있어.\""},{"type":"narrative","value":"그녀는 자루가 닳도록 쥔 도끼를 고쳐 쥐며, 결의에 찬 눈빛으로 나를 직시했다."},{"type":"dialogue","who":"","value":"\"우리는 사그라드는 조국의 불씨를 살리기 위해, 금기시되던 태고의 소환 의식을 집행했어... 그리고 그 기적의 끝에서 내게 찾아와 준 것이, 바로 너야.\""},{"type":"section","value":"제2절: 전승에서 이르기를 (下)"},{"type":"narrative","value":"숨 돌릴 틈도 없이 회랑 밖에서 서늘한 바람이 불어왔다. 안나는 회랑 구석에 놓여 있던 고풍스러운 금빛 궤짝으로 다가가 묵직한 물건 하나를 꺼내 들었다. 그것은 활도, 검도 아닌... 마치 둔직한 권총을 연상시키는 이질적인 형태의 고대 신기(神器)였다."},{"type":"narrative","value":"안나는 그것을 유심히 바라보며 조심스레 내게 내밀었다."},{"type":"dialogue","who":"","value":"\"전승에 이르기를... '진정한 열쇠 브레이다브리크를 바쳐라. 그렇다면 이계로부터 브레이다브리크를 쏘아낼 진정한 영웅이 나타날 것이다...' 라고 했어.\""},{"type":"narrative","value":"그녀는 신기의 매끄러운 금속 표면을 만지작거리며 갸우뚱한 표정을 지었다."},{"type":"dialogue","who":"","value":"\"그런 고로 이 신기 '브레이다브리크'는 네가 사용할 수 있을 것 같긴 한데... 하지만 이거, 참 이상한 모양이네. '쏜다'고 표현되어 있는데 아무리 봐도 활처럼 보이진 않고...\""},{"type":"narrative","value":"그때였다. 회랑 입구 너머 통로에서 또다시 거친 발소리가 겹쳐 들려왔다."},{"type":"dialogue","who":"","value":"\"찾아냈다! 이쪽이다, 포위해라!\""},{"type":"narrative","value":"이번에는 한두 명이 아니었다. 둔탁한 갑옷 소리와 함께 수십 명의 엠블라 제국 병사들이 회랑의 출구를 완전히 봉쇄해 들어왔다. 방금 전 전투로 안나의 숨은 여전히 거칠어질 대로 거칠어져 있었다."},{"type":"dialogue","who":"","value":"\"큭, 또...! 정말 끈질긴 녀석들이야.\""},{"type":"narrative","value":"안나는 입술을 꽉 깨물며 도끼를 고쳐 쥐었지만, 사방을 둘러싼 적들의 기세에 얼굴이 쇄락하게 질려갔다. 지형도, 인원도 절망적이었다."},{"type":"dialogue","who":"","value":"\"안 좋은데... 적의 수가 너무 많아. 나 혼자서는...\""},{"type":"narrative","value":"안나는 나를 향해 고개를 돌렸다. 그녀의 눈빛에는 미안함과 절박함이 교차하고 있었다."},{"type":"dialogue","who":"","value":"\"너라도... 어서 도망쳐...!\""},{"type":"narrative","value":"그 순간, 내 손에 쥐여 있던 신기 '브레이다브리크'가 미친 듯이 진동하기 시작했다. 차가웠던 쇠붙이가 순식간에 뜨거운 열기를 품더니, 그 총구 끝에서 눈이 멀 것 같은 찬란한 백색 광편이 뿜어져 나왔다."},{"type":"scene","value":"쿠우우우웅—!"},{"type":"narrative","value":"광음과 함께 회랑 전체가 눈부신 빛으로 휩싸였다. 엠블라 병사들도, 안나도 눈을 가리며 비명을 질렀다."},{"type":"dialogue","who":"","value":"\"어...? 지금 이 빛은...!\""},{"type":"narrative","value":"빛이 잔잔해지며 흩어지자, 공기의 흐름이 멈춘 듯한 정적 속에서 한 남자의 모습이 드러났다. 깃털 장식이 달린 고풍스러운 궁수 복장에, 신비로운 바람의 마력이 넘쳐흐르는 대궁(大弓)을 든 사내였다. 남자는 불쾌하다는 듯 미간을 찌푸리며 사방을 둘러보았다."},{"type":"dialogue","who":"","value":"\"백야왕국의 왕자, 타쿠미다. 일단... 풍신궁을 계승하고 있지. 나도 강하니깐.\""},{"type":"narrative","value":"안나는 입을 벌린 채 그 자리에 망연자실하게 서 있었다."},{"type":"dialogue","who":"","value":"\"이, 이건... '영웅'!? 설마, 네가 정말로 영웅을 소환한 거야!? 이런 일이...!\""},{"type":"narrative","value":"그녀의 눈에 경악과 함께 커다란 전율이 스쳐 지나갔다. 이계에서 온 무력해 보이던 이방인이, 아스크 왕국의 그 누구도 성공하지 못했던 전승 속 소환을 단 한 순간에 성공시켜 버린 것이었다."},{"type":"dialogue","who":"","value":"\"이런, 지금은 감탄하고 있을 때가 아니지!\" 안나는 이내 정신을 차리고 고함을 질렀다. \"영웅과 협력해서 적을 쓰러뜨이자!\""},{"type":"narrative","value":"소환된 영웅 타쿠미는 시큰둥한 표정으로 활시위를 당겼다. 바람의 정령이 집속하듯 풍신궁 끝에 붉고 푸른 화살촉이 맺혔다."},{"type":"dialogue","who":"","value":"\"활은 전방 1칸 떨어진 적을 정확히 꿰뚫을 수 있어! 좋아, 마력의 흐름이 차올랐다. 오의스킬 '유성'을 발동해!\""},{"type":"narrative","value":"안나의 지휘와 내 손 끝에서 느껴지는 감각이 하나로 이어졌다. 타쿠미의 손에서 떠나간 화살은 혜성 같은 궤적을 그리며 엠블라 병사들의 방패를 일격에 산산조각 냈다. 연이어 터지는 화살의 폭포 속에 전열을 상실한 엠블라 군은 처참하게 무너져 내렸다."},{"type":"narrative","value":"안나가 도끼를 휘둘러 마지막 잔당을 처단하며 싸움은 순식간에 끝이 났다."},{"type":"dialogue","who":"","value":"\"후우... 이겼구나. 고마워, 소환사!\""},{"type":"narrative","value":"안나는 활짝 웃으며 내 어깨를 툭 쳤다. 그 시선에는 이제 의심이라곤 조금도 남아있지 않았다."},{"type":"dialogue","who":"","value":"\"너, 정말 굉장한 힘을 숨기고 있었구나... 우리 특무기관 사람들조차 영웅을 소환하는 건 아무도 할 수 없는데. 후후, 역시 내 눈은 틀리지 않았어! 너야말로 우리 나라를 구할 진정한 영웅... 그리고 영웅을 거느릴 자격을 가진 '소환사'인 거야!\""},{"type":"narrative","value":"그녀는 상쾌하게 도끼를 허리에 차며 선언했다."},{"type":"dialogue","who":"","value":"\"그런 고로, 앞으로 잘 부탁할게! 좋아, 특무기관 '바이스 브레이브'에 온 걸 환영해!\""},{"type":"chapter","value":"[서장(序章)]"},{"type":"section","value":"치천의 세계: 황금 날개의 왕자"},{"type":"narrative","value":"전장의 매캐한 연기가 채 걷히기도 전에, 회랑 너머에서 헐떡이는 발소리와 함께 두 명의 남녀가 모습을 드러냈다."},{"type":"narrative","value":"정교하게 세공된 붉은 장식의 갑옷을 입은 단정한 용모의 청년, 그리고 귀여운 외모에 화려한 장창을 든 발랄한 인상의 소녀였다. 청년은 안나를 발견하자마자 얹혀 있던 안도의 숨을 내쉬었다."},{"type":"dialogue","who":"","value":"\"안나 대장! 무사하셔서 다행이에요.\""},{"type":"narrative","value":"청년의 시선이 이내 안나의 곁에 서 있던 나에게 머물렀다. 내 손에 쥐인 신기 브레이다브리크를 본 그의 푸른 눈동자가 경악으로 크게 뜨였다."},{"type":"dialogue","who":"","value":"\"...? 그 사람은... 설마!\""},{"type":"dialogue","who":"","value":"\"그래, 알폰스. 그 의식을 치르고 나서 나타났어.\""},{"type":"narrative","value":"안나는 다정하게 내 어깨를 짚으며 청년에게 소개했다."},{"type":"dialogue","who":"","value":"\"이분은 소환사. 옛 전승대로... 신기 브레이다브리크를 쏘아내고 이계의 영웅을 소환하는 힘을 가졌어.\""},{"type":"narrative","value":"왕자라 불린 청년, 알폰스는 곧바로 깍듯하게 고개를 숙이며 정식으로 경의를 표했다."},{"type":"dialogue","who":"","value":"\"만나서 반가워, 소환사. 네가 이계의 대영웅인가... 만날 수 있어서 영광이야. 나는 알폰스, 특무기관의 일원이자 이 아스크 왕국의 왕자다.\""},{"type":"narrative","value":"그는 진지한 눈빛으로 나를 바라보며 말을 이었다."},{"type":"dialogue","who":"","value":"\"갑작스럽게 미안하지만, 네 힘을 빌려주지 않겠어? 방금 전 엠블라병들이 '문장의 세계'를 지배했어. 그들과 싸워 이계의 땅을 해방해야 해. ...참, 안나 대장. 방금 전 정찰 중에 수수께끼의 인물을 목격했어요. 이 땅의 영웅은 아닌 것 같았지만...\""},{"type":"dialogue","who":"","value":"\"수수께끼의 인물...? 그자도 엠블라의 인간일까?\""},{"type":"dialogue","who":"","value":"\"모르겠어요. 본 적 없는 가면의 남자였어요. 하지만 우선은... 눈앞의 적부터 쓰러뜨리죠!\""},{"type":"narrative","value":"알폰스의 말이 끝남과 동시에 회랑 모퉁이에서 기괴한 가공의 기운이 뿜어져 나왔다."},{"type":"dialogue","who":"","value":"\".........\""},{"type":"narrative","value":"얼굴 전체를 칠흑 같은 가면으로 가린 낯선 남자가 서늘한 살기를 뿜으며 서 있었다. 알폰스가 즉시 검을 뽑아 들며 소리쳤다."},{"type":"dialogue","who":"","value":"\"너도 엠블라의 병사인가? 그렇다면 용서치 않겠다! 영웅의 땅을 지배하는 것 따위가 용납될 것 같나!\""},{"type":"narrative","value":"가면의 남자는 낮게 읊조렸다."},{"type":"dialogue","who":"","value":"\"...그렇다면 '문'을 닫아주도록 하지.\""},{"type":"dialogue","who":"","value":"\"뭐!?\""},{"type":"narrative","value":"남자가 손을 내젓자 공간이 일그러지며 그는 환영처럼 모습을 감춰버렸다. 알폰스는 웻소리를 내며 검을 거두었다."},{"type":"dialogue","who":"","value":"\"큭... 도망쳐 버렸나.\""},{"type":"narrative","value":"안나가 씁쓸하게 혀를 찼다."},{"type":"dialogue","who":"","value":"\"'문'이란 건 이계와 이 세계를 잇는 존재야. 우리 아스크 왕족은 '문을 여는 힘'을 가지고 있지.\""},{"type":"dialogue","who":"","value":"\"그리고 엠블라 제국의 황족은 '문을 닫는 힘'을 가지고 있죠.\""},{"type":"narrative","value":"알폰스가 말을 받았다."},{"type":"dialogue","who":"","value":"\"양국의 힘은 둘이자 하나... 그런데도 놈들은 어느샌가 문을 닫는 것을 거부하고, 이계로 침공해 나가기 시작했어요. 그것을 막기 위해 결성된 것이 바로 우리 특무기관입니다. 자, 다음 전장으로 나아가죠. 정찰 중인 샤론이 걱정되는군요.\""},{"type":"narrative","value":"회랑을 벗어나 탁 트인 들판으로 나오자, 긴 창을 든 소녀가 방방 뛰며 우리를 향해 달려왔다."},{"type":"dialogue","who":"","value":"\"안나 대장, 오라버니! 오는 게 너무 늦잖아요—!\""},{"type":"dialogue","who":"","value":"\"미안해, 샤론. 여기까지 오는 동안에도 전투가 있었어.\""},{"type":"narrative","value":"샤론이라 불린 여동생 왕녀는 내 손에 들린 브레이다브리크를 보자마자 눈을 반짝이며 바짝 다가왔다."},{"type":"dialogue","who":"","value":"\"응응? 그 근처에 계신 분은... 그 손에서 찬연하게 빛나는 신기는...? 혹시 당신이 이계의 대영웅 님!? 기관의 모두가 꿈에서까지 그리던 소문의 구세주인가요—!?\""},{"type":"dialogue","who":"","value":"\"응, 이름은 소환사라고 해. 방금 전에도 훌륭한 지휘로 우리에게 힘을 빌려주었어.\""},{"type":"dialogue","who":"","value":"\"굉장—해! 굉장해요!! 역시 소환사 님! 백년 전부터 팬이었답니다!!\""},{"type":"narrative","value":"샤론은 내 손을 덥석 잡고 흔들며 활짝 웃었다."},{"type":"dialogue","who":"","value":"\"앗, 인사가 늦었네요. 저는 샤론이에요! 아스크 왕국의 왕녀이자 알폰스 오라버니의 여동생이죠!\""},{"type":"dialogue","who":"","value":"\"그래서 샤론, 전황은?\""},{"type":"narrative","value":"알폰스가 샤론의 들뜬 기세를 가라앉히며 물었다. 샤론은 곤란하다는 듯 볼을 부풀렸다."},{"type":"dialogue","who":"","value":"\"한마디로 하면 곤란하다고 할까요... 엠블라 군 녀석들, 하늘을 나는 붉은 영웅을 거느리고 있었어요.\""},{"type":"dialogue","who":"","value":"\"문장의 세계에 있는 적색의 영웅... 혹시 마케도니아의 미네르바 왕녀인가?\""},{"type":"narrative","value":"엠블라의 '계약'에 묶여 조종당하던 미네르바 왕녀와의 치열한 사투 끝에, 우리는 그녀를 강제 지배에서 해방시키는 데 성공했다. 미네르바는 고마움을 표하며 자신의 세계로 돌아갔지만, 휴식도 잠시— 왕국 본대로부터 급보가 도달했다."},{"type":"dialogue","who":"","value":"\"안나 대장! 엠블라 군이 대규모 군세를 전개해서 왕국의 영지를 침공했습니다!\""},{"type":"dialogue","who":"","value":"\"뭐라고요!? 설마 이 땅으로 우리를 유인한 게 양동 작전이었나...!\""},{"type":"narrative","value":"우리는 서둘러 아스크 왕국의 본거지로 발길을 돌렸다."},{"type":"narrative","value":"아스크 왕국 영내의 서쪽 언덕. 황량한 폐허 한가운데에 한 어린 소녀가 홀로 서 있었다."},{"type":"narrative","value":"화려하지만 어둡고 기괴한 문양이 새겨진 드레스를 입은 소녀. 엠블라 제국의 황녀, 베로니카였다. 그녀의 붉고 텅 빈 눈동자는 차가운 살기를 품고 있었다."},{"type":"dialogue","who":"","value":"\"착한 아이들이야, 나의 영웅들... 더욱 빼앗고, 더욱 부수고... 방해되는 인간은 죽여버려도 괜찮아.\""},{"type":"narrative","value":"베로니카는 혼잣말처럼 중얼거리며 인형을 만지작거렸다."},{"type":"dialogue","who":"","value":"\"이 나라만 없다면, 방해하는 건 아무도 없게 되어서... 나는 모든 영웅을 손에 넣을 수 있어...\""},{"type":"dialogue","who":"","value":"\"그렇게 두진 않겠어!\""},{"type":"narrative","value":"알폰스가 검을 뽑아 들며 정면으로 나섰다."},{"type":"dialogue","who":"","value":"\"엠블라 제국 베로니카 황녀... 나라를 유린하는 것을 우리가 용서할 것 같으냐!\""},{"type":"narrative","value":"베로니카는 귀찮다는 듯 고개를 천천히 돌렸다."},{"type":"dialogue","who":"","value":"\"벌써 돌아왔어...? 모처럼 놀이 상대를 준비해 뒀는데, 귀찮은 인간들... ...? 너는...\""},{"type":"narrative","value":"베로니카의 시선이 나에게 머물렀다. 그 순간 그녀의 눈빛이 잔혹하게 일렁였다."},{"type":"dialogue","who":"","value":"\"그 신기... 설마 전승의 소환사...? 그래... 그렇다면 너를 첫 번째로 죽일 거야...\""},{"type":"narrative","value":"베로니카의 손짓 하나에 칠흑 같은 기운을 뿜어내는 암야의 영웅, 마크스가 거대한 검을 들고 앞을 막아섰다."},{"type":"narrative","value":"전설 속 영웅들과 황녀의 압도적인 마력 앞에 특무기관 대원들은 악전고투를 벌였다. 내가 브레이다브리크로 소환한 영웅들과 알폰스, 샤론의 목숨을 건 방어 끝에 베로니카의 군세는 서서히 밀리기 시작했다."},{"type":"dialogue","who":"","value":"\"시시해...\""},{"type":"narrative","value":"베로니카는 입술을 짓씹으며 거센 마력을 거두었다."},{"type":"dialogue","who":"","value":"\"나는 또, 외톨이... 성에 돌아가서, 따뜻한 홍차나 더 마실래...\""},{"type":"narrative","value":"베로니카가 엠블라의 병력과 함께 철수하자 전장에는 침묵이 찾아왔다."},{"type":"dialogue","who":"","value":"\"후우... 어떻게든 철수시킨 것 같네.\""},{"type":"narrative","value":"안나가 거친 숨을 내쉬었다. 알폰스는 무겁게 고개를 저었다."},{"type":"dialogue","who":"","value":"\"네. 하지만 이것으로 끝이라 생각되진 않아요. 그들은 또 이 땅을 침공해 오겠죠. 미안해, 소환사... 이런 싸움에 휘말리게 해서. 하지만 우리에겐 네가 필요해.\""},{"type":"narrative","value":"알폰스는 내 눈을 똑바로 바라보며 진심 어린 손을 내밀었다."},{"type":"dialogue","who":"","value":"\"부디 앞으로도 힘을 빌려주었으면 해. 특무기관... '바이스 브레이브'의 일원으로서.\""},{"type":"chapter","value":"[제1장]"},{"type":"section","value":"문장의 세계: 영웅왕의 맹세"},{"type":"narrative","value":"아스크 왕국의 전열을 정비한 특무기관 '바이스 브레이브'는 엠블라 제국의 주력군이 몰려간 곳을 향해 이동했다."},{"type":"narrative","value":"그곳은 수많은 섬과 신비로운 호수가 교차하는 곳, '문장의 세계'였다."},{"type":"dialogue","who":"","value":"\"이 세계에는 이계에서도 가장 오래된 전설로 칭송받는 '영웅왕'의 칭호를 가진 자가 있어.\""},{"type":"narrative","value":"알폰스는 차분한 음성으로 장검의 자루를 어루만지며 말을 이었다."},{"type":"dialogue","who":"","value":"\"그 이름은 마르스. 암흑룡 메디우스를 타도하고 아카네이아 대륙에 평화를 가져온 고결한 영웅이지. 하지만 그 훌륭한 왕자조차 지금은 엠블라의 주술에 묶여 조종당하고 있어.\""},{"type":"dialogue","who":"","value":"\"엠블라의 '계약'이라는 건 정말 끔찍해요!\" 샤론이 창 자루를 꽉 쥐며 억울한 듯 입을 내밀었다. \"자신의 의지와는 상관없이 아스크 왕국을 공격해야만 한다니... 우리가 하루빨리 그 계약을 깨부수고 마르스 님을 자유롭게 해드려야 해요!\""},{"type":"narrative","value":"우리는 엠블라 제국의 주술에 구속된 영웅들이 진를 치고 있는 관문으로 다가섰다."},{"type":"narrative","value":"관문 앞, 붉은 망토를 두르고 서늘한 성검 파르시온을 쥔 청년이 우리를 기다리고 있었다. 그 굳건한 태도와 신의가 넘치는 눈빛만으로도 그가 전설 속의 영웅왕 마르스임을 한눈에 알 수 있었다."},{"type":"narrative","value":"그러나 그의 눈동자 가장자리에는 엠블라 주술 특유의 기분 나쁜 붉은 마력이 희미하게 일렁이고 있었다."},{"type":"dialogue","who":"","value":"\"더 이상 다가오지 마라, 아스크의 기사들이여.\""},{"type":"narrative","value":"마르스는 안타까운 기색이 역력한 목소리로 나직하게 읊조렸다."},{"type":"dialogue","who":"","value":"\"내 의지와는 상관없이... 내 손에 쥐인 성검은 너희를 베라 명하고 있다. 엠블라 제국과의 '계약'이 내 몸을 억지로 움직이고 있어.\""},{"type":"narrative","value":"\"마르스 님! 제발 싸움을 거두어 주세요!\" 샤론이 소리쳤다."},{"type":"narrative","value":"마르스는 고개를 내저으며 성검 파르시온을 빼들었다."},{"type":"dialogue","who":"","value":"\"미안하다... 나로서도 이 굴레를 짓쇄지 못하는구나. 나와 겨루어 나를 쓰러뜨려라. 그것만이 이 무의미한 굴종을 끝낼 유일한 길이다!\""},{"type":"dialogue","who":"","value":"\"모두, 전투 태세로!\" 안나 대장이 도끼를 휘두르며 고함쳤다. \"마르스 왕자의 힘은 압도적이야! 소환사, 전선 배치를 부탁해!\""},{"type":"narrative","value":"나는 손에 든 신기 브레이다브리크를 내걸며 소환된 영웅들에게 지시를 내렸다. 마르스의 곁에는 그를 수호하는 아카네이아의 정예 영웅들—동쪽의 칼날 라간과 시전사들이 견고한 척후병을 이루고 있었다."},{"type":"dialogue","who":"","value":"\"지형을 활용해 라간의 돌파를 차단한다! 샤론, 우측 숲으로 우회해!\""},{"type":"narrative","value":"나의 지휘에 맞춰 바이스 브레이브의 전열이 일사불란하게 움직였다. 샤론의 창이 엠블라의 척후병을 쳐내고, 알폰스의 검이 마르스의 무서운 검기를 겨우 튕겨냈다."},{"type":"narrative","value":"마르스의 검격은 찰나의 순간에도 정교하고 매서웠다. 성검 파르시온이 그리는 푸른 궤적이 알폰스의 쇠갑옷을 가르며 날카로운 불꽃을 튀겼다."},{"type":"narrative","value":"\"큭... 과연 영웅왕! 일격 일격의 묵직함이 달라...!\" 알폰스가 이빨을 깨물며 버텼다."},{"type":"dialogue","who":"","value":"\"지금이다, 후방에서 공격을 집속해!\""},{"type":"narrative","value":"내가 내린 신호와 함께 소환된 영웅의 화살과 마법이 마르스의 빈틈을 꿰뚫었다. 거센 마력의 충격파 속에 마르스는 성검을 땅에 찌른 채 한쪽 무릎을 꿇었다."},{"type":"dialogue","who":"","value":"\"으윽... 훌륭하다...\""},{"type":"narrative","value":"그가 무릎을 꿇자마자, 마르스의 전신을 옥죄고 있던 붉은 주술의 사슬이 사르르 가루가 되어 공기 중으로 흩어져 사라졌다."},{"type":"dialogue","who":"","value":"\"하아... 하아...\""},{"type":"narrative","value":"마르스는 거친 숨을 내쉬며 천천히 자리에서 일어났다. 그의 붉게 물들어 있던 눈동자는 어느새 깊고 맑은 본래의 푸른빛을 되찾아 있었다."},{"type":"dialogue","who":"","value":"\"몸이... 가벼워졌어. 엠블라의 구속이 사라졌군.\""},{"type":"narrative","value":"마르스는 파르시온을 검집에 거두고는 우리를 향해 인자한 미소를 지으며 고개를 숙였다."},{"type":"dialogue","who":"","value":"\"고맙다, 아스크 왕국의 용사들이여. 그리고... 빼어난 지휘로 나를 구원해 준 소환사.\""},{"type":"narrative","value":"\"다행이에요! 주술이 풀어졌군요, 마르스 님!\" 샤론이 기뻐서 방방 뛰었다."},{"type":"narrative","value":"\"네 덕분에 나의 조국과 동료들에게 부끄럽지 않은 존재로 돌아올 수 있었다.\" 마르스는 나에게 다가와 단단한 손길로 악수를 청했다."},{"type":"dialogue","who":"","value":"\"나의 성검 파르시온은 이제 너희의 힘이 될 것이다. 언제든 아스크 왕국이 위기에 처했을 때 나를 부르거라. 영웅왕의 맹세를 걸고, 너희와 함께 싸우겠다!\""},{"type":"narrative","value":"마르스는 빛의 잔영과 함께 자신의 세계인 아카네이아 대륙으로 안전하게 귀환했다."},{"type":"narrative","value":"안나 대장은 멀어져 가는 빛을 보며 흐뭇한 미소를 짓고는 나를 향해 돌아섰다."},{"type":"dialogue","who":"","value":"\"좋은 시작이야! 제1장의 임무는 성공이다. 엠블라가 묶어두었던 문장의 세계의 계약은 완벽하게 해제되었어.\""},{"type":"narrative","value":"알폰스 역시 깊은 안도의 한숨을 내쉬며 검을 정돈했다."},{"type":"dialogue","who":"","value":"\"하지만... 베로니카 황녀와 엠블라 제국은 아직 수많은 이계의 영웅들을 구속하고 있어. 우리가 쉴 시간은 없을 것 같아.\""},{"type":"dialogue","who":"","value":"\"네! 오라버니 말이 맞아요!\" 샤론이 나를 향해 눈을 반짝였다. \"자, 다음은 어떤 영웅이 기다리고 있는 세계로 떠날까요, 소환사 님!?\""},{"type":"chapter","value":"[제2장]"},{"type":"section","value":"관문의 세계: 밤하늘을 가르는 붉은 날개"},{"type":"narrative","value":"문장의 세계를 해방한 특무기관 '바이스 브레이브'는 곧바로 다음 이계로 통하는 영원의 문을 넘었다."},{"type":"narrative","value":"차원의 틈새를 지나 도착한 곳은 웅장한 요새와 높은 관문들이 산맥을 따라 솟아 있는 '관문의 세계'였다. 험준한 절벽 사이로 차가운 산바람이 불어오고 있었다."},{"type":"dialogue","who":"","value":"\"이곳은 여러 국경과 요새가 몰려 있는 관문의 세계야.\""},{"type":"narrative","value":"안나 대장이 서늘한 산바람을 맞으며 지형을 둘러보았다."},{"type":"dialogue","who":"","value":"\"엠블라 군은 이 험준한 요새 지형을 점령하고, 이계의 영웅들을 차례로 구속해 전선에 배치하고 있어. 방심했다간 고지대에서 쏟아지는 화살과 마법에 몰살당할 수 있어.\""},{"type":"dialogue","who":"","value":"\"웻, 보기만 해도 가파른 절벽이네요...\" 샤론이 손으로 햇빛을 가리며 산봉우리를 쳐다보았다. \"오라버니, 저 위쪽에 무언가 붉은빛이 번뜩이고 있어요!\""},{"type":"narrative","value":"알폰스가 샤론이 가리킨 곳으로 시선을 돌렸다. 그의 눈매가 날카롭게 가라앉았다."},{"type":"dialogue","who":"","value":"\"페가수스 기사인가...! 붉은 장갑을 두른 공중 부대다. 엠블라의 주술이 짙게 깔려 있어.\""},{"type":"narrative","value":"바람을 가르며 하늘에서 내려온 것은 페가수스를 탄 세 명의 자매 기사 중 둘째인 카트리나였다. 붉은 머리칼을 휘날리며 미네르바 왕녀를 섬기던 고결한 기사였으나, 지금은 붉게 일렁이는 엠블라의 '계약'으로 인해 눈빛이 차갑게 죽어 있었다."},{"type":"dialogue","who":"","value":"\"더 이상 아스크의 발길을 허락하지 않는다...\""},{"type":"narrative","value":"카트리나는 굳게 닫힌 관문 위에서 날카로운 슬렌 스피어를 빼들었다."},{"type":"dialogue","who":"","value":"\"우리는 엠블라 황녀와의 계약에 묶인 몸. 이 관문을 통과하고 싶다면... 우리를 꿰뚫고 지나가라!\""},{"type":"narrative","value":"\"크읏, 페가수스 기사의 기동력은 위협적이야!\" 알폰스가 검을 다잡으며 소리쳤다."},{"type":"narrative","value":"나는 즉시 손에 쥔 브레이다브리크를 내걸고 지형을 파악했다."},{"type":"dialogue","who":"","value":"\"지형이 좁은 산길이다! 비행 부대는 공중에서 단숨에 간격을 좁혀온다. 양쪽 절벽의 엄폐물을 활용해 거리를 유지해라!\""},{"type":"narrative","value":"\"지휘를 맡길게, 소환사!\" 안나 대장이 내 신호에 맞춰 전열을 정비했다."},{"type":"narrative","value":"카트리나가 이끄는 천공의 기사들이 일제히 고지대에서 내리꽂히듯 돌진해 왔다. 날카로운 창 끝이 공기를 가르며 쇠음과 함께 바닥을 짓찔렀다."},{"type":"narrative","value":"하지만 사전에 지형을 활용해 배진한 우리 전열의 수비는 견고했다. 전방에서 알폰스와 안나가 공격을 받아내고, 후방에서 소환된 영웅들의 궁시가 페가수스의 날개를 꺾었다."},{"type":"dialogue","who":"","value":"\"으윽... 결계가... 무너진다...\""},{"type":"narrative","value":"합을 주고받은 끝에, 카트리나의 전신을 옥죄던 주술의 붉은 실이 허공으로 산산이 부서졌다."},{"type":"dialogue","who":"","value":"\"하아... 하아... 고맙다.\""},{"type":"narrative","value":"카트리나는 페가수스의 갈기를 다정하게 쓸어내리며 깊은 한숨을 내쉬었다."},{"type":"dialogue","who":"","value":"\"엠블라의 굴레에 묶여 내 의지와 상관없이 무기를 휘두를 수밖에 없었다... 너희의 용맹함이 나를 구원했군.\""},{"type":"narrative","value":"\"무사하셔서 다행이에요, 카트리나 님!\" 샤론이 다가가 위로했다."},{"type":"narrative","value":"\"하지만 조심해라.\" 카트리나는 관문 너머 깊은 골짜기를 가리키며 엄숙하게 경고했다."},{"type":"dialogue","who":"","value":"\"이 관문 깊은 곳에는... '검성'이라 불리는 광기의 검사와, 엠블라의 주술로 강화된 강력한 기마 부대가 진을 치고 있다. 엠블라의 계약은 깊어질수록 영웅의 정신마저 좀먹는다.\""},{"type":"narrative","value":"\"검성...?\" 알폰스가 고개를 갸웃거렸다."},{"type":"dialogue","who":"","value":"\"오직 베기 위해 살아가는 자... 검마(劍魔) 카렐이다. 그의 검에 자비란 없다. 부디 무운을 빈다.\""},{"type":"narrative","value":"카트리나는 감사의 인사를 남긴 뒤 밤하늘 너머로 날아올라 자신의 세계로 돌아갔다."},{"type":"narrative","value":"관문 내부의 어두운 본당."},{"type":"narrative","value":"칠흑 같은 어둠 속에서 오직 차가운 검기(劍氣)만이 유령처럼 일렁이고 있었다. 그 중앙에 검은 옷을 두른 남자가 홀로 서 있었다. 붉은 피의 향기에 굶주린 듯한 맑고도 섬뜩한 눈동자."},{"type":"dialogue","who":"","value":"\"크크크... 들어왔나, 베어 넘길 수 있는 고기들이...\""},{"type":"narrative","value":"카렐은 허리춤의 명검을 나직하게 빼들었다. 그가 검을 뽑아 드는 것만으로도 본당 내부의 공기가 찢어지는 듯한 압박감이 밀려왔다."},{"type":"dialogue","who":"","value":"\"나는 그저 베고 싶을 뿐이다... 황녀와의 계약 따위 아무래도 좋아. 네놈들의 피로 이 검을 적실 수만 있다면...!\""},{"type":"dialogue","who":"","value":"\"전원, 경계해라!\" 안나가 고함을 질렀다. \"저자의 검기는 지금까지의 적들과 차원이 달라!\""},{"type":"narrative","value":"카렐의 몸이 순식간에 잔상으로 변하며 내 앞까지 파고들었다. 치명적인 일격이 목덜미를 노리고 날아든 찰나—"},{"type":"scene","value":"콰앙—!"},{"type":"narrative","value":"알폰스가 간발의 차로 검을 내던지듯 막아서며 강렬한 불꽃이 튀었다."},{"type":"narrative","value":"\"소환사에게는 손대지 못한다!\" 알폰스가 이빨을 깨물며 버텼지만, 카렐의 가공할 검기에 쇠갑옷이 갈라져 피가 비쳐 나왔다."},{"type":"dialogue","who":"","value":"\"지금이야! 카렐의 일격 후 빈틈을 노려라! 전원 공격 집속!\""},{"type":"narrative","value":"나의 지휘가 전장에 울려 퍼졌다."},{"type":"narrative","value":"소환된 영웅들이 카렐의 사각지대에서 일제히 마력과 화살을 쏟아부었고, 샤론의 창이 카렐의 검격을 봉쇄했다. 연이어 터진 마력 폭발 속에서 카렐의 무시무시한 광기 또한 주술의 해제와 함께 사그라들었다."},{"type":"dialogue","who":"","value":"\"흐흐... 훌륭한... 검이었다...\""},{"type":"narrative","value":"카렐은 검을 거두며 핏자국을 닦아냈다. 그의 눈에서 섬뜩한 엠블라의 붉은 마력이 사라져 있었다."},{"type":"dialogue","who":"","value":"\"너희의 지휘관... 꽤나 재미있는 눈을 하고 있군. 다음번에 만날 때는 엠블라의 주술 따위가 아닌, 내 자신의 의지로 네놈들의 목을 베러 오겠다...\""},{"type":"narrative","value":"카렐은 불길한 웃음을 남긴 채 빛의 입자가 되어 사라졌다."},{"type":"narrative","value":"\"후아아... 정말 죽는 줄 알았어요!\" 샤론이 다리에 힘이 풀린 듯 주저앉으며 가슴을 쓸어내렸다."},{"type":"narrative","value":"\"하지만 이걸로 관문의 세계에 묶여 있던 엠블라의 계약은 모두 해제되었어.\" 안나 대장이 지도판을 거두며 미소를 지었다."},{"type":"narrative","value":"알폰스는 피가 묻은 장갑을 고쳐 쥐며 나를 향해 고개를 숙였다."},{"type":"dialogue","who":"","value":"\"소환사, 네 판단이 없었다면 나와 샤론은 방금 전 전사했을지도 몰라. 뛰어난 대장으로서 우리를 이끌어줘서 고맙다.\""},{"type":"narrative","value":"\"헤헤, 역시 소환사 님은 우리 특무기관의 제일가는 구세주라니까요!\" 샤론이 금세 기운을 차리고 일어나 내 팔을 꼭 껴안았다."},{"type":"narrative","value":"\"하지만 방심할 순 없지.\" 안나가 진지한 표정으로 북쪽 하늘을 바라보았다."},{"type":"dialogue","who":"","value":"\"엠블라 제국의 침략은 더욱 거세지고 있어. 다음으로 우리가 향해야 할 곳은... 더욱 깊은 이계, [제3장 암야의 세계]야!\""},{"type":"chapter","value":"[제3장]"},{"type":"section","value":"암야의 세계: 칠흑을 가르는 기사도"},{"type":"narrative","value":"관문의 세계를 뒤로하고 영원의 문을 넘자, 시야를 가득 채운 것은 영원한 밤이 내려앉은 칠흑의 대지였다."},{"type":"narrative","value":"하늘에는 핏빛처럼 차가운 달만이 홀로 떠 있었고, 황량한 석조 성채와 안개가 서린 들판이 기괴한 분위기를 풍기고 있었다. 바로 '암야의 세계'였다."},{"type":"dialogue","who":"","value":"\"이곳이... 암야의 세계인가요?\" 샤론이 어두컴컴한 주위를 둘러보며 몸을 떨었다. \"빛이 거의 들지 않아서 어쩐지 가슴이 답답해져요...\""},{"type":"dialogue","who":"","value":"\"경계를 게을리하지 마라, 샤론.\" 알폰스가 검을 뽑아 들며 주변의 어둠을 경계했다. \"암야 왕국은 강력한 기마 부대와 뛰어난 암영 마법을 사용하는 영웅들이 즐비한 곳이다. 게다가...\""},{"type":"narrative","value":"알폰스는 서장 시절, 베로니카 황녀의 곁을 지키던 그 압도적인 중전사의 모습을 떠올렸다."},{"type":"dialogue","who":"","value":"\"엠블라 황녀 베로니카가 가장 신뢰하는 강적이자 암야 왕국의 첫째 왕자, 마크스가 이 세계에 진을 치고 있어.\""},{"type":"dialogue","who":"","value":"\"그래, 마크스의 기사도와 검술은 이계에서도 손꼽힐 정도지.\" 안나 대장이 도끼를 고쳐 쥐며 고개를 끄덕였다. \"하지만 그 고결한 기사조차 베로니카와의 '계약'이라는 사슬에 묶여 아스크를 향해 검을 누르고 있어. 소환사, 이번 싸움도 네 지휘에 특무기관의 목숨이 달렸다.\""},{"type":"narrative","value":"안개 속을 헤치고 성채 깊숙이 들어서자, 어둠 속에서 묵직한 기마 소리와 함께 고풍스러운 드레스를 입은 소녀, 그리고 매서운 검기를 품은 왕자가 모습을 드러냈다."},{"type":"narrative","value":"암야 왕국의 첫째 공주 카밀라와 막내 왕자 레온, 그리고 그 중앙에 검은 갑옷을 두르고 명검 지크프리트를 쥐고 있는 암야의 첫째 왕자 마크스였다."},{"type":"narrative","value":"그러나 그들의 눈동자는 베로니카의 주술로 인해 붉은 광기 대신, 거역할 수 없는 지독한 굴종의 빛으로 차갑게 식어 있었다."},{"type":"narrative","value":"\"왔는가, 아스크의 쥐새끼들...\" 마크스는 차갑고 묵직한 목소리로 나직하게 읊조렸다."},{"type":"dialogue","who":"","value":"\"마크스 님!\" 알폰스가 앞으로 나서며 소리쳤다. \"당신처럼 고결한 영웅이 어째서 엠블라의 참혹한 침략에 협력하는 거요! 그것이 당신이 말하는 기사도인가!\""},{"type":"narrative","value":"마크스는 눈 하나 찌푸리지 않은 채 명검 지크프리트를 내걸었다. 검 끝에서 칠흑 같은 암흑 마력이 아지랑이처럼 피어올랐다."},{"type":"dialogue","who":"","value":"\"...기사도라. 계약은 절대적이다.\" 마크스의 음성에는 깊은 슬픔과 포기가 얽혀 있었다. \"주인과의 계약을 맺은 이상, 그 명령이 비록 악일지라도 전력을 다해 완수하는 것이 나의 의지. 이유 따위는 필요 없다. 내 검을 막아서고 싶다면... 나의 목을 베고 지나가라!\""},{"type":"narrative","value":"\"마크스 형님, 저들을 어서 처리하죠.\" 레온이 암야의 마도서를 펼쳐 들며 차가운 주문을 외우기 시작했다."},{"type":"narrative","value":"\"불쌍한 아이들... 누나가 아프지 않게 단숨에 보내줄게...\" 카밀라 역시 포돌을 타고 하늘로 솟구쳐 오르며 날카로운 도끼를 다잡았다."},{"type":"narrative","value":"\"전원, 전멸 위기다! 진형을 뒤로 물려라!\" 안나 대장의 고함과 함께 전장이 순식간에 난장판으로 변했다."},{"type":"narrative","value":"레온의 범위 마법이 지면을 폭파시키고, 하늘에서는 카밀라의 기습적인 강하 공격이 밀려들었다. 그리고 그 중심에서 마크스의 기마 돌격이 맹렬한 기세로 아스크의 전열을 깨뜨리려 했다."},{"type":"narrative","value":"나는 손에 쥔 브레이다브리크를 움켜쥐고 급박하게 전황을 분석했다."},{"type":"dialogue","who":"","value":"\"지형의 어둠에 현혹되지 마라! 레온의 마법 충전 시간을 노려 샤론이 우측 마법진을 분쇄한다! 알폰스는 마크스의 정면 돌격을 방어선으로 유인해라!\""},{"type":"narrative","value":"나의 정교한 지휘에 따라 소환된 영웅들이 민첩하게 움직였다."},{"type":"narrative","value":"샤론의 창이 레온의 마도서를 쳐내어 주문을 저지했고, 카밀라의 공중 습격은 후방 궁수들의 집중 사격으로 차단되었다."},{"type":"narrative","value":"그리고 마침내 정면. 마크스의 명검 지크프리트가 칠흑의 일격을 내리꽂는 순간, 알폰스가 이를 사력을 다해 받아내고, 내가 소환한 정예 영웅들이 마크스의 사각지대를 완벽하게 포위했다."},{"type":"scene","value":"콰앙—!"},{"type":"narrative","value":"마력의 폭발과 함께 마크스는 말에서 내려앉아 한쪽 무릎을 꿇었다. 검집을 쥔 그의 손이 미세하게 떨렸고, 전신을 가두고 있던 엠블라의 붉은 주술 사슬이 하나씩 소멸해 갔다."},{"type":"dialogue","who":"","value":"\"하아... 하아...\""},{"type":"narrative","value":"마크스는 무겁게 깔린 안개 속에서 천천히 고개를 들었다. 그의 차갑게 식어 있던 눈동자에 드디어 본래의 굳건하고 고결한 지성이 돌아와 있었다."},{"type":"dialogue","who":"","value":"\"훌륭하다... 나의 지크프리트를 이정도로 완벽하게 봉쇄해 내다니...\""},{"type":"narrative","value":"마크스는 검을 거두며 단정한 예의를 갖춰 나를 바라보았다."},{"type":"dialogue","who":"","value":"\"너의 지휘... 조금의 망설임도, 헛됨도 없더군. 과연 엠블라의 황녀가 경계할 만한 소환사다.\""},{"type":"narrative","value":"\"주술이 풀어졌군요, 마크스 님!\" 알폰스가 검을 거두며 안도의 숨을 내쉬었다."},{"type":"narrative","value":"\"음. 덕분에 엠블라와의 구속에서 벗어났다.\" 마크스는 나직하게 읊조리며 나에게 다가왔다."},{"type":"dialogue","who":"","value":"\"비록 계약에 묶여 너희와 칼을 맞대었으나, 너희가 보여준 당당한 기상과 용맹함은 참된 기사의 그것이었다. 소환사여, 너에게 나의 존경을 표한다.\""},{"type":"narrative","value":"마크스는 허리를 숙여 경의를 표한 뒤, 여동생 카밀라와 남동생 레온을 돌아보았다. 그들 역시 주술에서 깨어나 온화한 표정을 되찾아 있었다."},{"type":"dialogue","who":"","value":"\"우리는 이제 우리의 세계로 돌아가겠다. 하지만 잊지 마라... 베로니카 황녀는 쉽게 포기할 자가 아니다. 다음 세계에서는 더욱 가혹한 시련이 너희를 기다릴 터.\""},{"type":"narrative","value":"\"명심하겠습니다, 마크스 님.\" 알폰스가 고개를 숙였다."},{"type":"dialogue","who":"","value":"\"그럼, 다시 만날 날을 기약하지.\""},{"type":"narrative","value":"빛의 입자와 함께 암야 왕국의 영웅들이 자신들의 세계로 돌아가자, 어둡게 깔려 있던 암야의 세계에 희미한 새벽빛이 들어차기 시작했다."},{"type":"narrative","value":"\"후우... 암야의 왕족들을 상대하는 건 정말 진이 빠지는 일이었어요.\" 샤론이 땀을 닦으며 기분 좋게 웃었다."},{"type":"dialogue","who":"","value":"\"하지만 소환사 님 덕분에 이번에도 모두를 구해낼 수 있었네요!\""},{"type":"narrative","value":"\"그래. 이로써 암야의 세계도 엠블라의 손귀에서 해방되었다.\" 안나 대장이 지도에 표시를 남기며 만족스럽게 고개를 끄덕였다."},{"type":"narrative","value":"그러나 알폰스의 표정은 여전히 무거웠다. 그는 멀리 차원의 틈새 너머를 응시하고 있었다."},{"type":"narrative","value":"\"알폰스, 무슨 생각 해?\" 안나가 묻자 알폰스가 천천히 입을 열었다."},{"type":"dialogue","who":"","value":"\"베로니카 황녀가 조종하는 영웅들은 아직도 수없이 남아있어. 그리고... 그 뒤에서 아스크와 엠블라의 싸움을 부추기는 '가면의 남자'의 정체도 여전히 베일에 싸여 있지.\""},{"type":"narrative","value":"알폰스는 나를 향해 결의에 찬 눈빛을 보냈다."},{"type":"dialogue","who":"","value":"\"갈 길이 멀지만... 소환사, 너와 함께라면 어떤 시련도 헤쳐나갈 수 있을 것 같아. 자, 다음 이계로 향하자!\""},{"type":"chapter","value":"[제4장]"},{"type":"section","value":"백야의 세계: 벚빛 아래의 무사도"},{"type":"narrative","value":"암야의 세계를 뒤로하고 새로운 차원의 문을 지나자, 조금 전까지의 칠흑 같은 어둠이 거짓말이었던 것처럼 눈부신 햇살과 함께 분홍빛 벚꽃잎이 바람을 타고 휘날렸다."},{"type":"narrative","value":"푸른 하늘과 웅장한 목조 성곽, 맑은 시냇물이 흐르는 고즈넉한 대지. 바로 '백야의 세계'였다."},{"type":"dialogue","who":"","value":"\"와아...! 정말 아름다운 곳이에요!\" 샤론이 떨어지는 벚꽃잎을 손으로 받으며 감탄사를 내뱉었다. \"암야의 세계와는 완전히 딴판이네요. 공기마저도 따스해요.\""},{"type":"dialogue","who":"","value":"\"경치를 즐기는 건 나중으로 미뤄야겠어, 샤론.\" 알폰스가 목조 대문 너머를 유심히 살피며 검을 다잡았다. \"이 아름다운 백야의 대지 역시 엠블라의 참혹한 주술에 짓밟혀 있어. 저기 봐.\""},{"type":"narrative","value":"알폰스가 가리킨 성문 앞에는 붉은 무구와 장웅한 기개를 뿜어내는 백야의 무사들이 삼엄하게 전열을 갖추고 있었다. 백야 왕국의 첫째 공주 히노카와 둘째 왕자 타쿠미, 그리고 그 중앙에 신검 라이진토를 쥔 백야의 첫째 왕자 료마였다."},{"type":"narrative","value":"그러나 료마의 강렬한 눈빛 구석에는 베로니카의 주술이 남긴 붉은 결계의 기운이 맴돌고 있었다."},{"type":"dialogue","who":"","value":"\"멈춰라, 아스크의 침입자들이여.\""},{"type":"narrative","value":"료마는 신검 라이진토를 천천히 뽑아 들었다. 검신에서 번뜩이는 황금빛 뇌전이 벚꽃잎을 태우며 사방으로 흩어졌다."},{"type":"dialogue","who":"","value":"\"나는 백야 왕국의 첫째 왕자 료마. 비록 나의 의지가 아닐지라도, 황녀와의 '계약'이 내 몸을 움직여 너희를 베라 명하고 있다.\""},{"type":"narrative","value":"\"료마 님! 저희는 싸우러 온 것이 아닙니다! 제발 엠블라의 지배에서 벗어나 주세요!\" 알폰스가 외쳤다."},{"type":"narrative","value":"료마는 안타까움과 묵직한 결의가 뒤섞인 목소리로 고개를 저었다."},{"type":"dialogue","who":"","value":"\"말을 아껴라, 용사여. 백야의 무사에게 계약이란 목숨과도 같은 것... 나를 멈추고 싶다면, 전력을 다해 나의 뇌전을 꺾어 보아라!\""},{"type":"narrative","value":"\"오라버니의 명이다! 모두 무기를 들어라!\" 히노카가 천마를 몰아 공중으로 솟구쳤고, 타쿠미 역시 풍신궁을 겨누며 시위를 당겼다."},{"type":"dialogue","who":"","value":"\"콰르릉—!\""},{"type":"narrative","value":"료마의 라이진토에서 뿜어져 나온 거대한 벼락이 지면을 찢어발겼다. 백야 특유의 기동력 있는 무도 부대와 고지대를 점령한 궁수, 천마 기사들의 입체적인 공세에 바이스 브레이브 전선이 크게 흔들렸다."},{"type":"narrative","value":"\"큭... 라이진토의 번갯불이 너무 강해! 근접전으로는 접근조차 할 수 없어!\" 안나 대장이 도끼를 방패 삼아 뇌전을 막아내며 소리쳤다."},{"type":"narrative","value":"나는 즉시 브레이다브리크를 움켜쥐고 전장의 흐름을 꿰뚫어 보았다. 백야군의 뇌전은 강력하지만, 명확한 공격 주기가 존재했다."},{"type":"dialogue","who":"","value":"\"당황하지 마라! 료마의 뇌전 충전 직후 3초의 빈틈이 생긴다! 히노카의 천마 부대는 후방 궁수로 견제하고, 타쿠미의 화살 궤적은 중앙 나무 병풍을 엄폐물로 삼아 차단해라!\""},{"type":"narrative","value":"나의 명쾌한 지휘가 전장에 울려 퍼지자, 아스크의 전열이 물 흐르듯 간격을 재정비했다."},{"type":"narrative","value":"샤론과 소환된 영웅들이 히노카의 공중 강하를 차단했고, 타쿠미의 화살이 엄폐물에 막혀 빗나간 순간— 알폰스가 뇌전의 틈새를 파고들어 료마의 라이진토 검신을 검으로 눌러 멈췄다."},{"type":"dialogue","who":"","value":"\"지금이다! 공격을 집중해!\""},{"type":"narrative","value":"나의 신호와 함께 소환된 영웅들의 강력한 마력과 사격이 료마의 사각지대에 일격으로 내리꽂혔다."},{"type":"scene","value":"콰앙—!"},{"type":"narrative","value":"거대한 마력의 폭발 속에 료마의 전신을 채우고 있던 엠블라의 붉은 주술 사슬이 화염이 되어 산산이 부서져 내렸다."},{"type":"dialogue","who":"","value":"\"하아... 하아...\""},{"type":"narrative","value":"료마는 신검 라이진토를 지면에 짚은 채 거친 숨을 내쉬었다. 그의 강렬했던 눈동자에 마침내 본래의 맑고 고결한 지성이 되돌아와 있었다."},{"type":"dialogue","who":"","value":"\"멋진 지휘였다... 아스크의 소환사여.\""},{"type":"narrative","value":"료마는 검을 검집에 거두고 천천히 일어서서 나를 향해 깊이 고개를 숙였다."},{"type":"dialogue","who":"","value":"\"내 마음은 엠블라의 주술에 갇혀 탄식하고 있었으나, 너의 탁월한 책략이 나를 구원했구나. 진심으로 감사한다.\""},{"type":"narrative","value":"\"주술이 완전히 풀어졌네요, 료마 님!\" 샤론이 기쁨의 미소를 지었다."},{"type":"narrative","value":"\"음. 히노카와 타쿠미 역시 구속에서 벗어났다.\" 료마는 동생들을 둘러본 뒤 나에게 단단한 손길로 악수를 청했다."},{"type":"dialogue","who":"","value":"\"백야 왕국의 무사로서, 너희가 보여준 정당함과 용기에 경의를 표한다. 언젠가 백야의 땅이 아닌 전장에서 다시 만난다면, 그땐 너희의 든든한 아군으로서 신검 라이진토를 휘두르겠다.\""},{"type":"narrative","value":"빛의 입자와 함께 료마와 백야의 영웅들은 벚꽃 바람 속으로 모습을 감추며 자신들의 세계로 돌아갔다."},{"type":"narrative","value":"\"후우... 뇌전 때문에 전신이 짜릿짜릿하네요.\" 샤론이 머리를 털어내며 기분 좋게 웃었다."},{"type":"narrative","value":"\"하지만 이걸로 백야의 세계에 묶인 계약도 해제되었어. 소환사, 정말 대단한 지휘였어!\" 안나 대장이 지도판을 거두며 미소를 지어 보였다."},{"type":"narrative","value":"알폰스는 벚꽃잎이 날리는 하늘을 바라보며 깊은 생각에 잠겼다."},{"type":"dialogue","who":"","value":"\"문장, 관문, 암야, 그리고 백야... 수많은 이계의 영웅들이 하나씩 해방되고 있어. 하지만 베로니카 황녀가 노리는 다음 목표는 결코 만만치 않을 거야.\""},{"type":"narrative","value":"알폰스는 나를 돌아보며 굳건한 눈빛을 내보였다."},{"type":"dialogue","who":"","value":"\"다음은... 수많은 시련과 절망을 이겨낸 자들이 살아가고 있는 [각성의 세계]다. 가자, 소환사!\""},{"type":"chapter","value":"[제5장]"},{"type":"section","value":"각성의 세계: 운명을 바꾸는 자들"},{"type":"narrative","value":"백야의 세계를 뒤로하고 새로운 차원의 문을 넘어서자, 황량하면서도 장엄한 대지 위에 드리워진 거대한 신전과 성채가 모습을 드러냈다."},{"type":"narrative","value":"하늘에는 신비로운 푸른 빛이 자욱하게 퍼져 있었고, 바람 속에는 굳건한 결의와 어딘가 씁쓸한 세월의 흔적이 함께 맴돌고 있었다. 바로 '각성의 세계'였다."},{"type":"dialogue","who":"","value":"\"이곳이... 각성의 세계군요.\" 샤론이 주변을 둘러보며 나직하게 읊조렸다. \"어쩐지 공기가 무겁고 깊은 느껴져요. 마치 거대한 운명의 흐름 속에 서 있는 것 같은...\""},{"type":"dialogue","who":"","value":"\"그래, 샤론.\" 알폰스가 검을 정돈하며 고개를 끄덕였다. \"이 세계의 영웅들은 절망적인 멸망의 미래를 이겨내고, 스스로의 손으로 운명을 개척해 낸 자들이다. 이리스 성왕국의 왕자 크롬, 그리고 시공을 넘어온 그의 딸 루키나... 모두 강인한 의지를 가진 영웅들이지.\""},{"type":"dialogue","who":"","value":"\"하지만 그 강한 의지조차 엠블라의 주술 앞에서는...\" 안나 대장이 씁쓸한 표정으로 도끼를 고쳐 쥐었다. \"방심하지 마. 크롬과 루키나의 검술은 이계에서도 손꼽히는 정밀함과 파괴력을 자랑하니까.\""},{"type":"narrative","value":"신전 앞 정원, 푸른 망토를 두르고 성검 파르시온을 내걸은 청년 크롬과, 가면을 벗어 던지고 날카로운 눈빛으로 우리를 노려보는 루키나가 단단히 전열을 갖추고 있었다."},{"type":"narrative","value":"그러나 그들의 푸른 눈동자 가장자리에는 엠블라 제국의 붉은 마력이 번개처럼 희미하게 일렁이고 있었다."},{"type":"dialogue","who":"","value":"\"거기까지다, 아스크의 특무기관.\""},{"type":"narrative","value":"크롬은 성검 파르시온을 쳐들었다. 검신에서 뿜어져 나오는 푸른 기운이 전장의 분위기를 압도했다."},{"type":"dialogue","who":"","value":"\"나의 의지는 이 무의미한 싸움을 거부하고 있다... 하지만 엠블라 황녀와의 '계약'이 내 영혼을 억누르고 내 팔을 강제로 움직이고 있어.\""},{"type":"dialogue","who":"","value":"\"크롬 님! 루키나 님!\" 알폰스가 앞으로 나서며 소리쳤다. \"당신들은 운명조차 뒤바꾼 용사들이 아닙니다! 제발 그 주술의 사슬을 쳐내주십시오!\""},{"type":"narrative","value":"루키나는 안타까운 눈빛으로 알폰스를 바라보며 성검을 고쳐 쥐었다."},{"type":"dialogue","who":"","value":"\"말은 필요 없습니다... 운명을 바꾸기 위해서는 때로 잔혹한 실력 행사만이 답이 되는 법. 우리의 검을 꺾지 못한다면... 당신들은 여기서 스러질 뿐입니다!\""},{"type":"narrative","value":"\"크롬 왕자의 돌진이다! 전원 수비 자세!\" 안나 대장이 소리쳤다."},{"type":"narrative","value":"콰아앙—!"},{"type":"narrative","value":"크롬과 루키나의 합체 공격은 가공할 정도로 완벽했다. 아버지가 맹렬한 돌진으로 아스크의 정면 방어선을 짓쇄면, 딸인 루키나가 찰나의 빈틈을 파고들어 치명적인 일격을 날렸다."},{"type":"narrative","value":"\"큭... 두 사람의 검격이 완벽하게 톱니바퀴처럼 맞아떨어지고 있어!\" 알폰스가 크롬의 중검을 받아내며 핏줄이 서도록 버텼다."},{"type":"narrative","value":"나는 즉시 브레이다브리크를 움켜쥐고 전장의 이면을 꿰뚫어 보았다. 두 사람의 조화는 완벽하지만, 크롬이 공격을 내리꽂는 순간 전신의 체중이 앞으로 쏠리는 명확한 특성이 있었다."},{"type":"dialogue","who":"","value":"\"알폰스, 억지로 버티지 말고 정면 공격을 사선으로 흘려내라! 샤론은 루키나의 측면 지원 궤적을 창 끝으로 봉쇄해라! 전원, 크롬이 균형을 잃는 찰나에 마력 사격을 집중한다!\""},{"type":"narrative","value":"나의 냉철한 지휘에 따라 특무기관의 전열이 유기적으로 움직였다."},{"type":"narrative","value":"알폰스가 사선으로 몸을 틀며 크롬의 파르시온을 흘려보냈고, 중심이 앞으로 쏠린 크롬의 사각지대로 소환된 영웅들의 마도서와 화살이 쏟아졌다. 연이어 샤론의 창이 루키나의 커버를 차단했다."},{"type":"narrative","value":"콰르릉—!"},{"type":"narrative","value":"거대한 마력 폭발이 신전 정원을 흔들었고, 그 충격파 속에서 크롬과 루키나를 옥죄던 엠블라의 붉은 주술 사슬이 가루가 되어 흩어졌다."},{"type":"dialogue","who":"","value":"\"하아... 하아...\""},{"type":"narrative","value":"크롬은 성검을 지면에 꽂은 채 거친 숨을 골랐다. 그의 눈을 가리고 있던 붉은 주술의 기운이 사그라들고, 깊고 맑은 지성의 푸른빛이 되돌아왔다."},{"type":"dialogue","who":"","value":"\"훌륭하군... 탁월한 지휘였다, 소환사.\""},{"type":"narrative","value":"크롬은 검을 거두고 나에게 다가와 단단하고 온화한 손길로 악수를 청했다."},{"type":"dialogue","who":"","value":"\"내 안의 영혼은 엠블라의 사슬에 묶여 탄식하고 있었지만... 너의 뛰어난 전술이 우리를 굴종의 늪에서 끌어올려 주었다.\""},{"type":"narrative","value":"\"무사하셔서 다행입니다, 아버지... 아니, 크롬 님.\" 루키나 역시 성검을 검집에 거두며 우리를 향해 예의를 갖춰 고개를 숙였다."},{"type":"dialogue","who":"","value":"\"당신들이 보여준 용기와 지혜... 미래를 바꿀 수 있는 진정한 힘이란 바로 이런 것이겠지요. 아스크 왕국의 소환사여, 당신에게 깊은 경의를 표합니다.\""},{"type":"narrative","value":"\"주술이 깨져서 정말 다행이에요!\" 샤론이 기쁨의 미소를 지었다."},{"type":"narrative","value":"크롬은 나를 바라보며 결의에 찬 목소리로 덧붙였다."},{"type":"dialogue","who":"","value":"\"우리는 우리의 이리스 대륙으로 돌아가겠지만... 잊지 마라. 절망이 깊어질수록 스스로의 손으로 운명을 쥐어짜 내야 한다. 구세주인 너와 함께라면 아스크의 미래도 반드시 밝을 것이다.\""},{"type":"narrative","value":"빛의 입자와 함께 크롬과 루키나, 그리고 각성의 영웅들은 자신들의 세계로 돌아갔다."},{"type":"narrative","value":"\"후우... 각성 영웅들의 기세는 정말 압도적이었어.\" 안나 대장이 지도판을 정리하며 안도의 숨을 내쉬었다."},{"type":"narrative","value":"\"맞아요! 하지만 소환사 님의 지휘 덕분에 이번에도 무사히 해방시킬 수 있었어요!\" 샤론이 내 곁으로 다가와 눈을 반짝였다."},{"type":"narrative","value":"알폰스는 조용히 성전 너머의 차원문을 바라보며 검을 굳게 쥐었다."},{"type":"dialogue","who":"","value":"\"이것으로 5개의 주요 이계—문장, 관문, 암야, 백야, 그리고 각성의 세계까지 해방되었어. 베로니카 황녀의 영향력도 크게 위축되었을 터.\""},{"type":"narrative","value":"알폰스는 나를 돌아보며 미소를 지었다."},{"type":"dialogue","who":"","value":"\"하지만 전선은 이제 외전과 더 깊은 이계로 이어지겠지. 소환사, 네가 있는 한 특무기관 '바이스 브레이브'는 결코 패배하지 않는다. 계속해서 다음 전장으로 나아가자!\""},{"type":"chapter","value":"[제6장]"},{"type":"section","value":"봉인의 세계: 붉은 사자의 후예"},{"type":"narrative","value":"각성의 세계에서 운명을 바꾼 기사들과 작별한 특무기관 '바이스 브레이브'는 또 다시 영원의 문을 넘어섰다."},{"type":"narrative","value":"새로운 차원을 뚫고 발을 딛은 곳은 광활한 평원과 고풍스러운 요새가 웅장하게 펼쳐진 대지였다. 바람에는 불꽃의 온기와 서늘한 철의 냄새가 섞여 있었다. 바로 '봉인의 세계'였다."},{"type":"dialogue","who":"","value":"\"이곳은 엘리베 대륙... 봉인의 세계야.\""},{"type":"narrative","value":"안나 대장이 서늘한 평원 바람을 맞으며 지도를 짚었다."},{"type":"dialogue","who":"","value":"\"이 세계에는 페레 공가의 후계자이자 붉은 사자의 의지를 이은 젊은 영웅 로이, 그리고 오스티아 공가의 뛰어난 마도사 릴리나가 있어. 어리지만 그들이 이끄는 리키아 동맹군의 단결력과 전략은 결코 가볍지 않지.\""},{"type":"narrative","value":"\"하지만 로이 님과 릴리나 님마저 엠블라의 주술에 묶여 있는 거군요...\" 샤론이 긴 창을 고쳐 쥐며 안타까운 듯 입술을 삐죽였다."},{"type":"narrative","value":"알폰스는 평원 저편에 솟아 있는 둔직한 석조 요새를 응시하며 검을 뽑아 들었다."},{"type":"dialogue","who":"","value":"\"응. 베로니카 황녀는 영웅의 나이나 성별을 가리지 않고 '계약'의 사슬을 짓눌러 자신들의 군대로 삼고 있어. 억압받는 영웅들의 영혼을 위해서라도 우리가 단숨에 요새를 해방해야 한다.\""},{"type":"narrative","value":"요새의 굳건한 성문 앞, 화염의 문양이 새겨진 붉은 망토를 두른 붉은 머리의 소년 로이가 성검을 쥐고 전열의 맨 앞에 서 있었다. 그 옆에는 웅장한 마도서를 품에 안은 릴리나와 리키아의 정예 영웅들이 엄숙한 진을 치고 있었다."},{"type":"narrative","value":"그러나 로이의 맑은 눈동자 너머에는 엠블라 주술 특유의 기분 나쁜 붉은 핏빛 마력이 희미하게 일렁이고 있었다."},{"type":"dialogue","who":"","value":"\"거기까지다, 아스크 왕국의 용사들이여.\""},{"type":"narrative","value":"로이는 나직하지만 결의에 찬 목소리로 검을 겨누었다."},{"type":"dialogue","who":"","value":"\"나의 마음은 이 싸움의 무의미함을 뼈저리게 알고 있다... 그러나 엠블라 제국과의 계약이 나의 의지를 짓눌러, 너희를 침략자로 규정하고 검을 휘두르라 명하고 있어.\""},{"type":"dialogue","who":"","value":"\"로이 님!\" 알폰스가 소리쳤다. \"당신은 리키아의 평화를 위해 싸운 정당한 리더입니다! 제발 엠블라의 지배에 굴하지 마십시오!\""},{"type":"narrative","value":"릴리나가 슬픈 눈빛으로 마도서를 펼쳐 들며 고개를 저었다."},{"type":"dialogue","who":"","value":"\"소용없어요... 계약의 사슬은 너무나 무겁고 단단해요. 우리의 의지로는 이 팔을 멈출 수 없어요... 제발, 우리의 무기를 부수고 구원해 주세요!\""},{"type":"narrative","value":"\"적의 마법 화력이 막강하다! 전원 수비 배진!\" 안나 대장이 고함쳤다."},{"type":"narrative","value":"콰아앙—!"},{"type":"narrative","value":"릴리나의 마도서에서 뿜어져 나온 거대한 붉은 화염(프로디지)이 평원 전체를 타오르게 만들었다. 동시에 로이가 이끄는 기병과 검사들이 일사불란한 포위망을 형성하며 아스크의 측면을 거세게 압박해 왔다."},{"type":"narrative","value":"\"큭! 적의 연계 플레이가 완벽해! 화염 마법에 갇힌 채 정면 돌격을 당하면 몰살이야!\" 알폰스가 로이의 매서운 검격을 겨우 내쳐내며 소리쳤다."},{"type":"narrative","value":"나는 즉시 브레이다브리크를 굳게 쥐고 전장의 판세를 쪼개어 분석했다. 로이 부대의 핵심은 릴리나의 후방 마법 지원과 로이의 정면 지휘선이었다."},{"type":"dialogue","who":"","value":"\"당황하지 마라! 릴리나의 화염 마법은 시전 후 5초간 마력 재충전 시간이 필요하다! 샤론, 우측 숲길을 타고 돌아 릴리나의 마법진을 봉쇄해라! 알폰스는 전선을 약간 물려 로이의 진형을 가로로 길게 늘려트려라!\""},{"type":"narrative","value":"나의 명확하고 정확한 지휘가 떨어지자마자 바이스 브레이브의 움직임이 번개처럼 바뀌었다."},{"type":"narrative","value":"샤론이 날렵하게 기습해 릴리나의 마법 시전을 차단했고, 전선이 늘어나며 로이와 후방 지원군 사이에 틈새가 벌어졌다."},{"type":"dialogue","who":"","value":"\"지금이다! 로이의 사각지대로 공격 집속!\""},{"type":"narrative","value":"나의 신호와 함께 소환된 영웅들의 집중 사격과 마력이 로이의 측면을 정확히 타격했다."},{"type":"scene","value":"콰앙—!"},{"type":"narrative","value":"마력 폭발의 충격파 속에 로이의 전신을 옥죄고 있던 엠블라의 붉은 주술 사슬이 가루가 되어 사방으로 흩어졌다."},{"type":"dialogue","who":"","value":"\"하아... 하아...\""},{"type":"narrative","value":"로이는 성검을 지면에 짚은 채 숨을 거칠게 헐떡였다. 그의 눈을 가리고 있던 기분 나쁜 붉은 빛이 사그라들고, 본래의 깊고 맑은 지혜의 눈빛이 돌아왔다."},{"type":"dialogue","who":"","value":"\"훌륭한 책략이었다... 아스크의 소환사여.\""},{"type":"narrative","value":"로이는 검을 검집에 거두고 나에게 다가와 깍듯하게 예의를 갖추어 인사를 건븸었다."},{"type":"dialogue","who":"","value":"\"내 마음은 주술에 갇혀 절망하고 있었지만, 너의 뛰어난 전술과 지휘가 우리를 무의미한 굴종에서 건져내 주었다. 진심으로 감사한다.\""},{"type":"narrative","value":"\"주술이 깨졌군요, 로이 님! 릴리나 님!\" 샤론이 기뻐하며 다가갔다."},{"type":"narrative","value":"릴리나 역시 온화한 미소를 지으며 나에게 고개를 숙였다."},{"type":"dialogue","who":"","value":"\"당신이 보여준 지혜와 결단력... 엠블라의 황녀가 왜 그토록 소환사 님을 두려워했는지 알 것 같아요.\""},{"type":"narrative","value":"로이는 나를 바라보며 단단한 목소리로 덧붙였다."},{"type":"dialogue","who":"","value":"\"우리는 다시 엘리베 대륙으로 돌아가겠지만... 아스크 왕국의 소환사여, 기억해라. 정의와 동료를 믿는 마음이 있는 한, 그 어떤 주술도 너를 꺾을 수 없다. 무운을 빈다!\""},{"type":"narrative","value":"빛의 입자와 함께 로이와 릴리나, 그리고 봉인의 영웅들은 자신들의 세계로 돌아갔다."},{"type":"narrative","value":"\"휴우... 어리다고 방심했다간 정말 큰일 날 뻔했어요!\" 샤론이 가슴을 쓸어내리며 미소를 지었다."},{"type":"narrative","value":"\"그래, 봉인의 영웅들이 보여준 결속력은 대단했지.\" 안나 대장이 지도판에 해방 표시를 남기며 만족스럽게 고개를 끄덕였다."},{"type":"narrative","value":"알폰스는 먼 하늘을 응시하며 손잡이를 굳게 쥐었다."},{"type":"dialogue","who":"","value":"\"이것으로 봉인의 세계까지 완전히 해방되었어. 하지만 엠블라 제국의 베로니카 황녀는 잔여 병력을 모아 더욱 깊고 참혹한 이계로 물러서고 있어.\""},{"type":"narrative","value":"알폰스는 나를 돌아보며 깊은 신뢰가 담긴 눈빛을 보냈다."},{"type":"dialogue","who":"","value":"\"다음은... 태고의 신기한 마력과 수인족, 그리고 용맹한 용병단이 살아가는 [창염의 세계]다. 가자, 소환사!\""},{"type":"chapter","value":"[제7장]"},{"type":"section","value":"창염의 세계: 신장(神將)의 거검"},{"type":"narrative","value":"봉인의 세계를 해방한 특무기관 '바이스 브레이브'는 또다시 차원의 문을 지나 새로운 이계로 발을 내딛었다."},{"type":"narrative","value":"눈앞에 펼쳐진 풍경은 울창하게 우거진 태고의 원시림과 험준한 산맥이었다. 거친 바람이 나뭇잎을 강하게 흔들었고, 공기 중에는 묵직하고 서늘한 투기(鬪氣)가 맴돌고 있었다. 바로 '창염의 세계'였다."},{"type":"dialogue","who":"","value":"\"이곳은 테리우스 대륙... 창염의 세계야.\""},{"type":"narrative","value":"안나 대장이 긴장한 기색으로 장갑을 고쳐 끼며 주변의 숲을 경계했다."},{"type":"dialogue","who":"","value":"\"이 세계에는 이계 전체를 통틀어도 최고의 검사로 칭송받는 사내... 그리일 용병단의 대장 아이크가 있어. 그의 거검 라그넬이 그리는 검기는 바위도 산도 잘라낼 정도지.\""},{"type":"dialogue","who":"","value":"\"신장 아이크 님...\" 알폰스 역시 장검의 자루를 굳게 어루만지며 서늘한 숨을 내쉬었다. \"강인한 기사와 수인(베오르크와 라구즈)들이 혼재하는 이 대지에서, 오직 실력과 인품만으로 전설이 된 자다. 하지만 그 사내마저 베로니카의 붉은 주술 사슬에 가두어져 있다니...\""},{"type":"narrative","value":"\"오라버니, 저기 보세요!\" 샤론이 울창한 숲 너머의 황량한 절벽 위를 가리켰다."},{"type":"narrative","value":"절벽 정상, 푸른 머리칼을 휘날리며 어깨에 제 몸집만 한 거대한 양손검 '라그넬'을 비스듬히 짊어진 사내가 서 있었다. 그 곁에는 그리일 용병단의 엘리트 영웅들이 삼엄하게 진을 치고 있었다."},{"type":"narrative","value":"그러나 아이크의 무뚝뚝하면서도 깊은 눈동자 구석에는 베로니카의 주술이 남긴 핏빛 마력이 기분 나쁘게 타오르고 있었다."},{"type":"dialogue","who":"","value":"\"거기까지다, 아스크의 특무기관.\""},{"type":"narrative","value":"아이크는 어깨에 매고 있던 거검 라그넬을 천천히 빼들었다. 검신이 지면에 닿는 것만으로도 묵직한 마찰음과 함께 둔탁한 파동이 전장에 퍼져나갔다."},{"type":"dialogue","who":"","value":"\"나의 의지는 이 무의미한 침략을 거부한다... 하지만 엠블라 제국과의 '계약'이라는 주술이 내 영혼을 억누르고, 너희를 베라 내 몸을 강제로 움직이고 있다.\""},{"type":"dialogue","who":"","value":"\"아이크 님!\" 알폰스가 정면으로 나서며 소리쳤다. \"당신은 불의에 굴하지 않는 자유로운 용병입니다! 제발 그 주술의 사슬을 쳐내주십시오!\""},{"type":"narrative","value":"아이크는 굳은 표정으로 고개를 내저으며 라그넬을 내걸었다. 검 끝에서 뿜어져 나오는 황금빛 뇌전과 암청색 검기가 전장의 공기를 압도했다."},{"type":"dialogue","who":"","value":"\"말은 필요 없다, 아스크의 왕자여... 용병에게 한 번 맺은 계약은 절대적인 것. 이 주술을 깨부수고 싶다면... 전력을 다해 나의 검을 꺾고 나를 넘어서라!\""},{"type":"narrative","value":"\"신장의 돌진이다! 전원, 직격만은 피해라!\" 안나 대장이 비명에 가까운 고함을 질렀다."},{"type":"narrative","value":"콰아앙—!"},{"type":"narrative","value":"아이크가 이끄는 그리일 용병단의 돌파력은 지금까지 만난 그 어떤 영웅들과도 차원이 달랐다. 아이크가 라그넬을 크게 휘두르자, 거대한 검풍이 지면을 가르며 아스크의 정면 방어선을 일격에 산산조각 냈다."},{"type":"narrative","value":"\"큭... 강해! 너무 강해! 정면에서 칼을 섞는 것조차 불가능하다!\" 알폰스가 아이크의 일격을 겨우 내쳐내며 튕겨 나가듯 물러섰다. 쇠갑옷에 굵은 균열이 가고 손끝이 마비될 정도의 파괴력이었다."},{"type":"narrative","value":"나는 즉시 브레이다브리크를 움켜쥐고 아이크의 중후한 검술 궤적을 쪼개어 분석했다. 라그넬의 가공할 파괴력 뒤에는 양손검 특유의 회전 후 일시적인 회수 지연이라는 명확한 물리적 빈틈이 존재했다."},{"type":"dialogue","who":"","value":"\"당황하지 마라! 아이크의 검풍(천공) 시전 직후 2초간 검을 고쳐 쥐는 틈이 생긴다! 알폰스는 억지로 받아치지 말고 좌측 절벽으로 회피해라! 샤론은 용병단의 후방 지원 사격을 창 끝으로 분쇄하고, 전원 아이크의 오른쪽 사각지대로 마력을 집속한다!\""},{"type":"narrative","value":"나의 단호하고 정확한 지휘가 떨어지자마자 바이스 브레이브의 움직임이 전설적인 기병처럼 날카롭게 흘렀다."},{"type":"narrative","value":"알폰스가 사선으로 몸을 던져 아이크의 거검을 흘려보냈고, 중심이 앞으로 쏠린 아이크의 사각지대로 소환된 영웅들의 강력한 마도서와 사격이 폭포수처럼 쏟아졌다."},{"type":"narrative","value":"콰르르릉—!"},{"type":"narrative","value":"거대한 마력 폭발의 충격파 속에 아이크의 전신을 옥죄고 있던 엠블라의 붉은 주술 사슬이 가루가 되어 사방으로 산산이 부서져 내렸다."},{"type":"dialogue","who":"","value":"\"하아... 하아...\""},{"type":"narrative","value":"아이크는 거검 라그넬을 지면에 깊숙이 꽂은 채 둔탁한 숨을 내쉬었다. 그의 눈을 가리고 있던 기분 나쁜 붉은 광기가 사그라들고, 깊고 굳건한 본래의 눈빛이 되돌아왔다."},{"type":"dialogue","who":"","value":"\"훌륭하군... 탁월한 지휘였다, 소환사.\""},{"type":"narrative","value":"아이크는 라그넬을 등에 짊어지고 천천히 걸어 나와 나에게 단단하고 투박한 손길로 악수를 청했다."},{"type":"dialogue","who":"","value":"\"내 마음은 주술의 사슬에 고통받고 있었으나, 너의 빼어난 책략과 지휘가 나를 굴종의 늪에서 끌어올려 주었다. 너처럼 강인한 눈을 가진 지휘관과 만난 것은 참으로 오랜만이구나.\""},{"type":"narrative","value":"\"주술이 깨졌군요, 아이크 님!\" 샤론이 기뻐하며 숨을 내쉬었다."},{"type":"narrative","value":"아이크는 온화하지만 무게감 있는 미소를 지으며 덧붙였다."},{"type":"dialogue","who":"","value":"\"우리는 다시 테리우스 대륙으로 돌아가겠지만... 아스크 왕국의 소환사여, 기억해라. 진정한 힘이란 무기의 크기가 아니라 동료를 수호하고자 하는 지혜와 결의에서 나오는 법. 너와 함께라면 아스크의 미래도 결코 무너지지 않을 것이다.\""},{"type":"narrative","value":"빛의 입자와 함께 아이크와 그리일 용병단의 영웅들은 창염의 숲속으로 모습을 감추며 자신들의 세계로 돌아갔다."},{"type":"narrative","value":"\"후아아... 지진이 난 줄 알았어요! 아이크 님의 검기는 정말 무서웠네요.\" 샤론이 다린 힘이 풀린 듯 한숨을 쉬며 웃었다."},{"type":"narrative","value":"\"그래, 창염의 신장을 해방해 낸 것은 정말 큰 성과야!\" 안나 대장이 지도판에 해방 마크를 새기며 만족스러운 표정을 지었다."},{"type":"narrative","value":"알폰스는 바람이 불어오는 산맥 너머를 응시하며 검집을 굳게 쥐었다."},{"type":"dialogue","who":"","value":"\"이것으로 테리우스 대륙의 창염의 세계까지 완전히 해방되었다. 베로니카 황녀가 가진 가장 강력한 영웅의 카드가 또 하나 사라진 셈이지.\""},{"type":"narrative","value":"알폰스는 나를 향해 신뢰가 가득 담긴 눈빛을 내보였다."},{"type":"dialogue","who":"","value":"\"하지만 싸움은 아직 끝나지 않았어. 다음은... 태고의 드래곤과 성스러운 피를 마주하게 될 [성마의 세계]다. 가자, 소환사!\""},{"type":"chapter","value":"[제8장]"},{"type":"section","value":"성마의 세계: 쌍벽을 이루는 용장"},{"type":"narrative","value":"창염의 거검을 뒤로하고 새로운 차원의 문을 지나자, 푸른 바다가 내다보이는 울창한 언덕과 오래된 성채의 자태가 모습을 드러냈다."},{"type":"narrative","value":"따스한 햇살이 내려앉은 평화로운 풍경이었지만, 공기 끝자락에는 불길한 암흑 마력의 흔적이 얇은 안개처럼 깔려 있었다. 바로 '성마의 세계'였다."},{"type":"dialogue","who":"","value":"\"이곳은 마르세리스 대륙... 성마의 세계군요.\" 샤론이 긴 창을 고쳐 쥐며 주변을 두리번거렸다. \"어쩐지 따뜻하고 정겨운 기운이 감돌면서도, 핏빛 같은 마력이 살짝 섞여 있는 기분이에요.\""},{"type":"dialogue","who":"","value":"\"방심하지 마라, 샤론.\" 알폰스가 장검을 정돈하며 엄숙한 표정으로 숲 너머를 바라보았다. \"이 세계를 대표하는 영웅은 르네 왕국의 쌍둥이 남매... 부드러운 인품 뒤에 강인한 결의를 품은 에리카 공주와, 백전백승의 창술을 자랑하는 용장 에브라임 왕자다.\""},{"type":"dialogue","who":"","value":"\"그래, 특히 에브라임 왕자의 기마 돌격은 방어선을 일격에 뚫어내는 파괴력이 있지.\" 안나 대장이 도끼를 비스듬히 쥐며 고개를 끄덕였다. \"하지만 그 고결한 남매조차 베로니카의 주술 사슬을 피하지 못했어. 소환사, 이번 전선도 네 신속한 지휘가 핵심이다.\""},{"type":"narrative","value":"성채 입구, 푸른 장식을 두른 검을 쥔 에리카 공주와, 묵직한 장창을 든 에브라임 왕자가 수많은 정예 병력과 함께 전열을 굳건히 하고 있었다."},{"type":"narrative","value":"그러나 두 사람의 맑고 우아한 눈동자 너머에는 엠블라 제국의 주술이 남긴 붉은 기운이 사슬처럼 그들의 의지를 옥죄고 있었다."},{"type":"dialogue","who":"","value":"\"더 이상 접근하지 마세요, 아스크의 기사분들...\""},{"type":"narrative","value":"에리카는 안타까운 눈빛으로 검을 천천히 빼들었다."},{"type":"dialogue","who":"","value":"\"저희의 본심은 여러분과의 싸움을 바라지 않습니다... 하지만 엠블라 황녀와의 '계약'이 내 손에 쥐인 무기를 억지로 움직이게 하고 있어요.\""},{"type":"narrative","value":"에브라임 역시 날카로운 창 끝을 우리를 향해 내걸며 씁쓸하게 읊조렸다."},{"type":"dialogue","who":"","value":"\"동생의 말이 맞다. 나의 의지는 무의미한 침략을 거부하지만... 이 주술의 사슬이 몸을 지배하고 있는 이상, 나 역시 전력을 다해 너희를 벨 수밖에 없다. 지고 싶지 않다면... 가진 무력을 모조리 짜내어 우리를 넘어서라!\""},{"type":"narrative","value":"\"에브라임 왕자의 기마 돌격이 온다! 전원 수비 진형!\" 안나 대장이 고함을 쳤다."},{"type":"narrative","value":"콰아앙—!"},{"type":"narrative","value":"쌍둥이 남매의 연계 공격은 가공할 정도로 날카로웠다. 에브라임이 전두에 서서 사나운 맹수처럼 기마 돌격으로 아스크의 전열을 짓쇄면, 에리카가 날렵한 풋워크로 찰나의 틈새를 파고들어 쾌속의 검격을 내리꽂았다."},{"type":"narrative","value":"\"큭... 두 사람의 공격 리듬이 완벽하게 이어지고 있어! 정면에서 맞서면 전선이 사분오열된다!\" 알폰스가 에브라임의 무서운 창격을 검으로 흘려내며 이를 악물었다."},{"type":"narrative","value":"나는 즉시 브레이다브리크를 움켜쥐고 전장의 이동 궤적을 쪼개어 분석했다. 남매의 연계는 훌륭하지만, 에브라임이 창을 크게 내지르는 순간 에리카와의 거리가 순간적으로 벌어지는 물리적 차이가 존재했다."},{"type":"dialogue","who":"","value":"\"지형의 바위지대를 활용해라! 알폰스는 에브라임의 돌격 궤적을 바위 뒤편으로 유인해 동선에 틈을 만들어라! 샤론은 측면에서 파고드는 에리카의 검을 봉쇄하고, 전원 에브라임과 에리카 사이의 갈라진 틈새로 마력을 집속한다!\""},{"type":"narrative","value":"나의 명쾌하고 냉철한 지휘가 전장에 울려 퍼졌다."},{"type":"narrative","value":"알폰스가 사선으로 몸을 틀며 에브라임을 유인하자, 남매의 거리가 순간적으로 분리되었다. 그 빈틈을 놓치지 않고 소환된 영웅들의 강력한 마도서와 사격이 두 사람 사이의 결계를 정확히 타격했다."},{"type":"narrative","value":"콰르르릉—!"},{"type":"narrative","value":"거대한 마력 폭발의 충격파 속에 에리카와 에브라임을 옥죄고 있던 엠블라의 붉은 주술 사슬이 가루가 되어 사방으로 산산조각 났다."},{"type":"dialogue","who":"","value":"\"하아... 하아...\""},{"type":"narrative","value":"에브라임은 장창을 지면에 꽂은 채 거친 숨을 내쉬었다. 그의 눈을 가리고 있던 붉은 광기가 사그라들고, 본래의 호탕하고 깊은 눈빛이 되돌아왔다."},{"type":"dialogue","who":"","value":"\"훌륭하군... 쌍둥이인 우리 둘의 호흡을 이 정도로 완벽하게 갈라놓을 줄이야.\""},{"type":"narrative","value":"에브라임은 창을 거두고 나에게 다가와 투박하고 단단한 손길로 악수를 청했다."},{"type":"dialogue","who":"","value":"\"내 영혼은 주술의 사슬에 갇혀 탄식하고 있었지만, 너의 탁월한 전술이 우리를 구원했다. 소환사여, 참으로 뛰어난 책략이다.\""},{"type":"narrative","value":"\"무사하셔서 다행이에요, 오빠... 그리고 아스크의 기사분들.\" 에리카 역시 검을 검집에 거두며 우리를 향해 고개 숙여 깊은 예의를 표했다."},{"type":"dialogue","who":"","value":"\"당신들이 보여준 진정한 용기와 지혜... 엠블라의 참혹한 지배에 맞서 싸우는 당신들에게 마르세리스 대륙의 가호가 함께하길 빌겠습니다.\""},{"type":"narrative","value":"\"주술이 완전히 풀렸네요!\" 샤론이 기쁨의 미소를 지었다."},{"type":"narrative","value":"에브라임은 나를 바라보며 결의에 찬 목소리로 덧붙였다."},{"type":"dialogue","who":"","value":"\"우리는 마르세리스 대륙으로 돌아가겠지만... 기억해라, 소환사. 승리를 향한 신념이 꺾이지 않는 한 결코 패배하지 않는다. 아스크의 미래를 부탁하마!\""},{"type":"narrative","value":"빛의 입자와 함께 에리카와 에브라임, 그리고 성마의 영웅들은 성채의 안개 너머로 모습을 감추며 자신들의 세계로 돌아갔다."},{"type":"narrative","value":"\"휴우... 에브라임 님의 창술은 정말 벼락 같았어요.\" 샤론이 가슴을 쓸어내리며 활짝 웃었다."},{"type":"narrative","value":"\"그래, 성마의 남매를 해방한 것은 전황에 아주 큰 전환점이야!\" 안나 대장이 지도판에 해방 표시를 적어 넣으며 만족스런 표정을 지었다."},{"type":"narrative","value":"알폰스는 바다가 바라보이는 언덕 너머를 응시하며 검집을 굳게 쥐었다."},{"type":"dialogue","who":"","value":"\"이것으로 성마의 세계까지 해방되었어. 이제 엠블라 제국의 베로니카 황녀가 조종하는 주요 이계의 영웅들도 거의 남아있지 않다.\""},{"type":"narrative","value":"알폰스는 나를 돌아보며 신뢰가 듬뿍 담긴 눈빛을 보냈다."},{"type":"dialogue","who":"","value":"\"하지만 싸움은 이제 본영을 향해 좁혀지고 있어. 다음은... 성스러운 혈통과 웅장한 서사시가 숨 쉬는 [성전의 세계]다. 가자, 소환사!\""},{"type":"chapter","value":"[제9장]"},{"type":"section","value":"성전의 세계: 운명의 성기사"},{"type":"narrative","value":"성마의 세계를 해방한 특무기관 '바이스 브레이브'는 빛나는 차원의 문을 지나 다시 한번 이계의 땅에 발을 딛었다."},{"type":"narrative","value":"눈앞에 펼쳐진 풍경은 눈 덮인 거대한 산맥과 끝없이 펼쳐진 고풍스러운 성곽 대지였다. 장엄하면서도 어딘가 비장하고 숙연한 바람이 깃들어 있었다. 바로 '성전의 세계'였다."},{"type":"dialogue","who":"","value":"\"이곳은 유그드랄 대륙... 성전의 세계입니다.\" 샤론이 입김을 하얗게 불며 신비로운 표정으로 주변을 둘러보았다. \"공기 속에 전설적인 신성함과 고결함이 가득 차 있는 느낌이에요.\""},{"type":"dialogue","who":"","value":"\"방심하지 마라, 샤론.\" 알폰스가 장검을 거두어 쥐며 눈앞의 평원을 응시했다. \"이 세계를 대표하는 자는 시알피 공가의 후계자이자 성검 티르핑을 쥐었던 전설의 성기사 시구르드... 그리고 은빛 머리카락의 성녀 디아도라다. 그들이 지닌 신성한 혈통의 힘은 이계 전체를 통틀어도 압도적이지.\""},{"type":"dialogue","who":"","value":"\"하지만 그 위대한 기사조차 엠블라의 주술을 피하지는 못했어.\" 안나 대장이 도끼 자루를 고쳐 쥐며 고개를 저었다. \"시구르드가 이끄는 중장 기병대의 돌격은 마찰하는 지면조차 갈라놓는다. 소환사, 진형이 붕괴되기 전에 해방의 일격을 날려야 해!\""},{"type":"narrative","value":"눈 덮인 대지 위, 은빛 갑옷에 푸른 망토를 두른 성기사 시구르드가 백마 위에 올라탄 채 성검을 내걸고 서 있었다. 그 곁에는 신성한 마력을 두른 디아도라와 유그드랄의 정예 기사들이 굳건한 진을 치고 있었다."},{"type":"narrative","value":"그러나 시구르드의 고결하고 깊은 눈동자 구석에는 베로니카의 주술이 남긴 붉은 결계 사슬이 불길하게 타오르고 있었다."},{"type":"dialogue","who":"","value":"\"더 이상 발을 들이지 마라, 아스크 왕국의 용사들이여...\""},{"type":"narrative","value":"시구르드는 나직하지만 웅장한 목소리로 신성한 검을 겨누었다."},{"type":"dialogue","who":"","value":"\"나의 영혼은 이 싸움의 무의미함에 탄식하고 있다... 그러나 엠블라 황녀와의 '계약'이라는 주술이 내 영혼을 옥죄어, 너희를 베라 내 몸을 강제로 움직이고 있다.\""},{"type":"dialogue","who":"","value":"\"시구르드 님!\" 알폰스가 앞으로 나서며 소리쳤다. \"당신은 불의와 운명에 맞서 싸운 비장한 기사입니다! 제발 그 주술의 사슬에 굴하지 마십시오!\""},{"type":"narrative","value":"디아도라 역시 안타까운 눈빛으로 성스러운 마도서를 감싸 쥐며 고개를 내저었다."},{"type":"dialogue","who":"","value":"\"소용없어요... 주술의 사슬이 영혼 깊숙이 뿌리내려 있어요. 당신들의 지혜와 힘으로... 제발 우리를 이 굴종의 사슬에서 구원해 주세요!\""},{"type":"narrative","value":"\"시구르드의 기병 돌격이다! 전원 수비 자세!\" 안나 대장이 소리쳤다."},{"type":"narrative","value":"콰아앙—!"},{"type":"narrative","value":"시구르드가 이끄는 성기사단의 돌파력은 가공할 정도로 거셌다. 백마를 몰아 바람처럼 돌진하는 시구르드의 검기(티르핑)가 지면을 갈라놓으며 아스크 특무기관의 방어선을 단숨에 유린했다."},{"type":"narrative","value":"\"큭... 성기사의 돌격력이 너무나 거세! 정면 방어선이 버티지 못한다!\" 알폰스가 시구르드의 일격을 겨우 흘려내며 튕겨 나가듯 둔탁한 소리를 냈다."},{"type":"narrative","value":"나는 즉시 브레이다브리크를 움켜쥐고 전장의 동선을 쪼개어 분석했다. 시구르드의 돌격은 압도적이지만, 기마 특유의 일직선 돌격 후 방향을 전환할 때 발생하는 미세한 선회 지연이 존재했다."},{"type":"dialogue","who":"","value":"\"당황하지 마라! 시구르드의 돌격 직후 둔덕 지형을 활용해 좌측으로 차단해라! 샤론은 후방 디아도라의 신성 마법 지원을 창 끝으로 봉쇄하고, 전원 시구르드가 선회하는 찰나의 사각지대로 마력을 집속한다!\""},{"type":"narrative","value":"나의 명쾌한 지휘가 떨어지자마자 바이스 브레이브의 움직임이 전설적인 기병대의 뒤를 찌르듯 날카롭게 흘렀다."},{"type":"narrative","value":"알폰스가 둔덕 뒤로 몸을 피하며 시구르드의 궤적을 틀어버렸고, 회전 기회를 잃은 시구르드의 측면으로 소환된 영웅들의 강력한 마력 사격이 집중되었다."},{"type":"narrative","value":"콰르르릉—!"},{"type":"narrative","value":"거대한 마력 폭발의 충격파 속에 시구르드와 디아도라를 옥죄고 있던 엠블라의 붉은 주술 사슬이 가루가 되어 사방으로 산산조각 났다."},{"type":"dialogue","who":"","value":"\"하아... 하아...\""},{"type":"narrative","value":"시구르드는 백마에서 내려 성검을 지면에 짚은 채 둔탁한 숨을 내쉬었다. 그의 눈을 가리고 있던 기분 나쁜 붉은 기운이 사그라들고, 본래의 고결하고 깊은 신성한 눈빛이 되돌아왔다."},{"type":"dialogue","who":"","value":"\"훌륭하군... 이 정도로 날카롭고 명쾌한 전술을 펼치는 지휘관을 만나게 될 줄이야.\""},{"type":"narrative","value":"시구르드는 검을 검집에 거두고 천천히 걸어 나와 나에게 깍듯하고 단단한 손길로 악수를 청했다."},{"type":"dialogue","who":"","value":"\"내 마음은 엠블라의 주술에 갇혀 절망하고 있었지만, 너의 탁월한 지휘가 나를 구원했구나. 참으로 깊은 감사를 표한다.\""},{"type":"narrative","value":"\"주술이 깨졌군요, 시구르드 님!\" 샤론이 기쁨의 미소를 지었다."},{"type":"narrative","value":"디아도라 역시 온화하고 미려한 미소를 지으며 나에게 깊이 고개를 숙였다."},{"type":"dialogue","who":"","value":"\"당신이 보여준 지혜와 결의... 어두운 운명조차 밝혀낼 빛과 같군요. 아스크 왕국의 소환사여, 당신의 앞날에 성스러운 가호가 함께하기를.\""},{"type":"narrative","value":"시구르드는 나를 바라보며 결의에 찬 목소리로 덧붙였다."},{"type":"dialogue","who":"","value":"\"우리는 다시 유그드랄 대륙으로 돌아가겠지만... 잊지 마라. 비록 운명의 시련이 가혹할지라도, 곧은 의지를 잃지 않는 한 빛은 결코 사라지지 않는다. 아스크의 미래를 이끌어다오!\""},{"type":"narrative","value":"빛의 입자와 함께 시구르드와 디아도라, 그리고 성전의 영웅들은 눈부신 빛 속으로 모습을 감추며 자신들의 세계로 돌아갔다."},{"type":"narrative","value":"\"휴우... 성기사 님의 돌격은 정말 전산이 날아가는 줄 알았어요!\" 샤론이 가슴을 쓸어내리며 활짝 웃었다."},{"type":"narrative","value":"\"그래, 성전의 영웅들까지 해방해 낸 것은 베로니카의 세력에 결정타를 날린 셈이야!\" 안나 대장이 지도판에 해방 마크를 적어 넣으며 만족스런 표정을 지었다."},{"type":"narrative","value":"알폰스는 설원 너머 붉게 물드는 노을을 응시하며 검집을 굳게 쥐었다."},{"type":"dialogue","who":"","value":"\"이것으로 주요 이계의 해방 작업이 마침내 결실을 맺어가고 있어. 이제 베로니카 황녀가 물러설 곳은 아스크 왕국 본영 근처의 최후 전선뿐이다.\""},{"type":"narrative","value":"알폰스는 나를 돌아보며 굳건한 신뢰가 담긴 눈빛을 보냈다."},{"type":"dialogue","who":"","value":"\"다음은... 엠블라 제국의 본대와 베로니카 황녀의 결전이 기다리는 [결전의 아스크]다. 가자, 소환사!\""},{"type":"chapter","value":"[제10장]"},{"type":"section","value":"결전의 아스크: 맺어진 인연, 끊어진 사슬"},{"type":"narrative","value":"수많은 이계를 넘어 영웅들을 해방시킨 특무기관 '바이스 브레이브'는 마침내 아스크 왕국과 엠블라 제국의 경계에 위치한 '봉인의 문' 앞 결전의 대지에 도달했다."},{"type":"narrative","value":"어두운 먹구름이 하늘을 가리고 있었고, 불길하고 거대한 엠블라의 암흑 마력이 온 대지를 진동시키고 있었다."},{"type":"narrative","value":"\"이곳이... 베로니카 황녀가 배후에서 모든 주술을 조종하던 최후의 거점이군요.\" 샤론이 긴 창을 고쳐 쥐며 침을 꼴깍 삼켰다."},{"type":"dialogue","who":"","value":"\"음. 문장, 관문, 암야, 백야, 각성, 봉인, 창염, 성마, 성전까지... 우리가 해방시킨 이계의 빛이 엠블라의 주술을 사분오열시켰다.\" 알폰스가 검집에서 장검을 천천히 빼들었다. 검신에 굳건한 결의가 번뜩였다. \"이제 남은 건 베로니카 황녀 본대와의 결전뿐이야.\""},{"type":"dialogue","who":"","value":"\"방심하지 마.\" 안나 대장이 전방을 경계하며 묵직한 목소리로 경고했다. \"베로니카 황녀가 조종하는 엠블라의 마술은 이계의 영웅들을 한꺼번에 재계약하여 소환할 수도 있어. 소환사, 네 브레이다브리크의 신성한 지휘만이 이 최후의 결전을 승리로 이끌 수 있다.\""},{"type":"narrative","value":"봉인의 문 언덕 위, 작은 체구에 칠흑 같은 제복과 거대한 엠블라의 마도서를 든 고독한 소녀— 엠블라 제국의 황녀 베로니카가 홀로 서 있었다. 그녀의 푸른 눈동자에는 아스크 왕국에 대한 아득한 고독과 핏빛 광기가 뒤섞여 있었다."},{"type":"dialogue","who":"","value":"\"결국 여기까지 찾아왔구나... 아스크의 왕자, 그리고... 소환사.\""},{"type":"narrative","value":"베로니카는 나직하고 냉정한 목소리로 마도서를 넓게 펼쳤다. 거대한 암흑 마력의 폭풍이 그녀의 사방에서 휘몰아쳤다."},{"type":"dialogue","who":"","value":"\"너희는 내가 모은 영웅들을 하나씩 빼앗아 갔어... 하지만 나는 외롭지 않아. 이 세계의 모든 영웅이 나의 친구가 될 때까지, 나는 싸움을 멈추지 않을 거야!\""},{"type":"dialogue","who":"","value":"\"나타나라, 나의 '계약'이여! 아스크의 특무기관을 잿더미로 만들어라!\""},{"type":"narrative","value":"베로니카의 외침과 함께 하늘이 갈라지고, 엠블라의 주술로 엮인 최정예 마도 부대와 잔여 영웅들이 압도적인 위용으로 전열을 메웠다."},{"type":"dialogue","who":"","value":"\"베로니카 황녀!\" 알폰스가 앞으로 나서며 외쳤다. \"외로움을 억압과 침략으로 채울 수는 없습니다! 무의미한 유혈의 사슬을 여기서 끝내십시오!\""},{"type":"narrative","value":"\"시끄러워... 너희 아스크 따위가 내 마음을 알 리가 없어!\" 베로니카가 손짓하자, 암흑의 화염과 칠흑의 벼락이 전장 전체를 덮쳐왔다."},{"type":"narrative","value":"콰아앙—! 콰르르릉—!"},{"type":"narrative","value":"베로니카의 암흑 마술은 지금까지 겪은 그 어떤 이계의 영웅들보다 가공할 파괴력을 지니고 있었다. 온 대지가 뒤흔들리고, 베로니카가 내뿜는 광범위 암흑 결계가 특무기관의 시야와 진형을 짓눌렀다."},{"type":"narrative","value":"\"큭... 암흑 마력의 전개 속도가 너무 빨라! 정면 돌파가 불가능해!\" 알폰스와 안나 대장이 암흑 마도탄을 막아내며 밀려났다."},{"type":"narrative","value":"나는 즉시 브레이다브리크를 하늘 높이 쳐들었다. 신기 브레이다브리크의 끝에서 눈부신 백은의 빛이 뿜어져 나오며 엠블라의 어둠을 찢어발겼다. 전장의 모든 흐름과 베로니카의 마력 순환 궤적이 내 머릿속에 투명하게 펼쳐졌다."},{"type":"dialogue","who":"","value":"\"지휘선 전원 집중해라! 베로니카 황녀의 암흑 결계는 마도서를 펼치는 7초 간격으로 마력의 주선이 노출된다! 샤론은 좌측 둔덕을 우회해 마도 부대의 측면을 차단해라! 알폰스는 결계의 중앙 축을 베어내라!\""},{"type":"narrative","value":"나의 단호하고 명쾌한 지휘가 전장에 울려 퍼지자, 지금까지 해방시켰던 모든 이계 영웅들의 유대와 아스크 특무기관의 기상이 하나로 뭉쳐졌다."},{"type":"narrative","value":"알폰스가 결계의 중심을 향해 검을 내지르고, 샤론이 측면을 차단한 찰나—"},{"type":"dialogue","who":"","value":"\"지금이다! 브레이다브리크, 계약의 사슬을 끊어라!\""},{"type":"narrative","value":"내가 쏜 신성한 소환의 빛이 베로니카의 마도서 중앙을 정확히 타격했다."},{"type":"narrative","value":"콰아아아앙—!"},{"type":"narrative","value":"찬란한 빛의 폭발이 대지를 덮쳤고, 베로니카 황녀를 감싸고 있던 엠블라의 불길한 주술 사슬들이 유리창이 깨지듯 산산조각이 나며 사방으로 흩어졌다."},{"type":"dialogue","who":"","value":"\"아... 아아...\""},{"type":"narrative","value":"마도서가 지면에 떨어지고, 베로니카 황녀는 무릎을 꿇은 채 거친 숨을 내쉬었다. 그녀를 옥죄고 있던 불길한 엠블라의 기운이 사그라들고, 깊은 고독만이 남은 소녀의 본래 눈빛이 되돌아왔다."},{"type":"dialogue","who":"","value":"\"나의... 계약이... 전부 풀려버렸어...\""},{"type":"narrative","value":"베로니카는 떨리는 손으로 지면을 짚으며 우리를 바라보았다."},{"type":"narrative","value":"알폰스는 검을 검집에 거두고 천천히 베로니카에게 다가가 손을 내밀었다."},{"type":"dialogue","who":"","value":"\"싸움은 끝났습니다, 베로니카 황녀. 영웅들을 억압하는 계약의 사슬로는 그 어떤 진정한 인연도 맺을 수 없습니다.\""},{"type":"narrative","value":"베로니카는 알폰스의 손을 가만히 바라보다가, 입술을 깨물며 고개를 내저었다."},{"type":"dialogue","who":"","value":"\"...차갑게 굴지 마. 나는 포기하지 않아. 언젠가... 언젠가 너희 아스크를 넘어서고 말 테니까...\""},{"type":"narrative","value":"베로니카는 엠블라의 마법 안개 속으로 모습을 감추며 전선에서 물러났다. 비록 싸움은 끝났지만, 그녀의 눈빛 속에서 이전과 같은 기분 나쁜 광기는 사라져 있었다."},{"type":"narrative","value":"어두웠던 하늘의 먹구름이 흩어지고, 웅장한 아스크 왕국의 대지 위로 눈부신 햇살이 쏟아져 내렸다."},{"type":"narrative","value":"\"해냈어요...! 해냈다고요, 오라버니! 소환사 님!\" 샤론이 긴 창을 내던지듯 껴안으며 기쁨의 눈물을 글썽였다."},{"type":"narrative","value":"\"그래... 이계의 영웅들도 모두 구원받았고, 아스크 왕국의 침략 위기도 무사히 넘겼어.\" 안나 대장이 지도판을 거두며 감격스러운 미소를 지었다."},{"type":"narrative","value":"알폰스는 맑게 게인 하늘을 바라본 뒤, 나에게 다가와 깊은 존경과 신뢰를 담아 고개를 숙였다."},{"type":"dialogue","who":"","value":"\"소환사... 네가 없었다면 우리 아스크 왕국은 엠블라의 주술 앞에 굴복했을 거다. 네 지혜와 지휘가 수많은 이계의 영웅들을 구했고, 우리 특무기관 '바이스 브레이브'를 승리로 이끌었어.\""},{"type":"narrative","value":"알폰스는 내 손을 단단히 잡으며 온화하게 미소 지었다."},{"type":"dialogue","who":"","value":"\"하지만 이 넓은 세계에는 아직 수많은 이계와 해결해야 할 운명의 시련들이 기다리고 있겠지. 앞으로도 우리와 함께 걸어가 주겠나, 최고의 지휘관이자 우리의 동료여?\""},{"type":"narrative","value":"바람을 타고 날아드는 이계의 벚꽃잎과 햇살 속에서, 아스크 왕국 특무기관의 서사시 제1부가 눈부시게 막을 내렸다."}];
const MAX_CHARS=420,MAX_BLOCKS=4;let chapter='파장(破章)',section='프롤로그',current=0,startX=0;const pages=[],tocEntries=[];
let buffer=[];let count=0;function flush(){if(buffer.length){pages.push({chapter,section,blocks:buffer});buffer=[];count=0}}
for(const item of storyData){if(item.type==='chapter'){flush();chapter=item.value;tocEntries.push({chapter,section:null,page:pages.length});continue}if(item.type==='section'){flush();section=item.value;tocEntries.push({chapter,section,page:pages.length});continue}const size=(item.value||'').length;if(buffer.length&&(count+size>MAX_CHARS||buffer.length>=MAX_BLOCKS))flush();buffer.push(item);count+=size}flush();
const textBody=document.getElementById('textBody'),chapterTag=document.getElementById('chapterTag'),sectionTitle=document.getElementById('sectionTitle'),progressBar=document.getElementById('progressBar'),pageIndicator=document.getElementById('pageIndicator'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),toc=document.getElementById('toc');
function render(direction=''){const page=pages[current];chapterTag.textContent=page.chapter;sectionTitle.textContent=page.section;textBody.className='text-body '+direction;textBody.replaceChildren();for(const item of page.blocks){const el=document.createElement(item.type==='dialogue'?'div':'p');if(item.type==='dialogue'){el.className='dialogue';const who=document.createElement('div');who.className='who';who.textContent=item.who;const words=document.createElement('div');words.className='words';words.textContent=item.value;el.append(who,words)}else{el.className=item.type==='scene'?'scene':'narrative';el.textContent=item.value}textBody.append(el)}progressBar.style.width=((current+1)/pages.length*100)+'%';pageIndicator.textContent=(current+1)+' / '+pages.length;prevBtn.disabled=current===0;nextBtn.disabled=current===pages.length-1;[...toc.querySelectorAll('button[data-page]')].forEach(b=>b.classList.toggle('current',+b.dataset.page===current))}
function move(delta){const next=current+delta;if(next<0||next>=pages.length)return;current=next;render(delta>0?'fade-next':'fade-prev')};function go(page){current=page;render();toggleDrawer()};function toggleDrawer(){document.getElementById('shade').classList.toggle('open');document.getElementById('drawer').classList.toggle('open')}
let lastChapter='';for(const entry of tocEntries){if(entry.chapter!==lastChapter){const label=document.createElement('div');label.className='toc-chapter';label.textContent=entry.chapter;toc.append(label);lastChapter=entry.chapter}if(entry.section){const b=document.createElement('button');b.dataset.page=entry.page;b.textContent=entry.section;b.onclick=()=>go(entry.page);toc.append(b)}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});document.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>55)move(d<0?1:-1)},{passive:true});render();
</script><style>body{perspective:1400px}.text-body{transform-style:preserve-3d}.text-body.fade-next{animation:bookNext .48s cubic-bezier(.22,.75,.25,1);transform-origin:left center}.text-body.fade-prev{animation:bookPrev .48s cubic-bezier(.22,.75,.25,1);transform-origin:right center}@keyframes bookNext{0%{opacity:0;transform:rotateY(-22deg) translateX(34px) scale(.985)}55%{opacity:1;transform:rotateY(4deg) translateX(-3px)}100%{opacity:1;transform:rotateY(0) translateX(0)}}@keyframes bookPrev{0%{opacity:0;transform:rotateY(22deg) translateX(-34px) scale(.985)}55%{opacity:1;transform:rotateY(-4deg) translateX(3px)}100%{opacity:1;transform:rotateY(0) translateX(0)}}</style><style>
.top-actions{display:flex;align-items:center;gap:4px}.bgm-button{border:0;background:transparent;color:#94a3b8;width:32px;height:32px;font-size:18px;cursor:pointer}.bgm-button.playing{color:#e2e8f0}.part-toggle{display:flex!important;align-items:center;justify-content:space-between;padding:14px 3px 9px!important;color:#e2e8f0!important;font:700 14px system-ui!important;border-bottom:1px solid #ffffff18!important}.part-content[hidden]{display:none}.part-content .toc-chapter{padding:17px 3px 5px}.text-body{font-size:17px;line-height:1.88;gap:16px}.dialogue{padding-left:15px}.words{font-size:1.04em}@media(max-height:650px){.text-body{font-size:15.5px;line-height:1.75;gap:10px}}
.reader{border-left:0!important;border-right:0!important}.text-body{justify-content:flex-start!important;gap:12px!important}@media(max-height:650px){.text-body{justify-content:flex-start!important;gap:8px!important}}
</style>
<script>
(() => {
  const top = document.querySelector('.top');
  const menu = top.querySelector('.menu-button');
  const actions = document.createElement('div'); actions.className = 'top-actions';
  const bgmButton = document.createElement('button'); bgmButton.className = 'bgm-button'; bgmButton.textContent = '♬'; bgmButton.setAttribute('aria-label', 'BGM 재생'); bgmButton.title = 'BGM 재생';
  menu.parentNode.insertBefore(actions, menu); actions.append(bgmButton, menu);
  const audio = new Audio(); audio.loop = true; audio.preload = 'none'; let source = 0; const files = ['bg.mp3', 'bg.mp4', 'bg.wav'];
  function setStopped(message){bgmButton.textContent='♬';bgmButton.classList.remove('playing');bgmButton.title=message;}
  async function startBgm(){for(let i=0;i<files.length;i++){source=i;audio.src=files[i];try{await audio.play();bgmButton.textContent='❚❚';bgmButton.classList.add('playing');bgmButton.title='BGM 정지';return true;}catch(e){}}setStopped('bg.mp3, bg.mp4 또는 bg.wav 파일을 같은 폴더에 넣어 주세요.');return false;}
  bgmButton.onclick = async () => { if(!audio.paused){audio.pause();setStopped('BGM 재생');return;} await startBgm();};
  startBgm(); document.addEventListener('pointerdown',()=>{if(audio.paused)startBgm()},{once:true});
  audio.onended=()=>setStopped('BGM 재생');
  const toc=document.getElementById('toc'); toc.replaceChildren();
  const toggle=document.createElement('button');toggle.className='part-toggle';toggle.innerHTML='<span>1부</span><span>▸</span>';
  const content=document.createElement('div');content.className='part-content';content.hidden=true;toc.append(toggle,content);
  let last=''; for(const entry of tocEntries){if(entry.chapter!==last){const label=document.createElement('div');label.className='toc-chapter';label.textContent=entry.chapter;content.append(label);last=entry.chapter}if(entry.section){const b=document.createElement('button');b.dataset.page=entry.page;b.textContent=entry.section;b.onclick=()=>{current=entry.page;render();content.hidden=true;toggle.lastElementChild.textContent='▸';toggleDrawer()};content.append(b)}}
  toggle.onclick=()=>{content.hidden=!content.hidden;toggle.lastElementChild.textContent=content.hidden?'▸':'▾'};
})();
</script></body></html>
